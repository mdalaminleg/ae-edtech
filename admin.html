<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin — EGA</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'DM Sans',sans-serif;background:#05080f;color:#f0f4f8;padding:1rem}
    h2{font-family:'Cormorant Garamond',serif;font-weight:400;margin-bottom:1rem}
    table{width:100%;border-collapse:collapse;font-size:0.85rem;margin-top:1rem}
    th{text-align:left;padding:0.6rem;color:#a0adb8;font-size:0.7rem;text-transform:uppercase;border-bottom:1px solid rgba(255,255,255,0.07)}
    td{padding:0.5rem 0.6rem;border-bottom:1px solid rgba(255,255,255,0.07)}
    .btn{background:#C9A84C;color:#000;padding:0.5rem 1rem;border:none;border-radius:6px;font-weight:500;cursor:pointer;font-size:0.8rem;margin:2px}
    .btn-red{background:#f0566a;color:#fff}
    .btn-green{background:#10d48e;color:#000}
    .badge{display:inline-block;padding:0.15rem 0.5rem;border-radius:12px;font-size:0.7rem}
    .bg{background:rgba(16,212,142,0.15);color:#10d48e}
    .bo{background:rgba(245,158,11,0.15);color:#f59e0b}
    .br{background:rgba(240,86,106,0.15);color:#f0566a}
    .tabs{display:flex;gap:0.5rem;margin-bottom:1rem;flex-wrap:wrap}
    .tab{padding:0.5rem 1rem;background:#111827;border:1px solid rgba(255,255,255,0.07);border-radius:6px;color:#7a8899;cursor:pointer;font-size:0.85rem}
    .tab.active{background:rgba(201,168,76,0.15);color:#C9A84C;border-color:#C9A84C}
    .section{display:none}
    .section.active{display:block}
  </style>
</head>
<body>

<h2>EGA Admin</h2>
<p style="color:#7a8899;margin-bottom:1rem" id="adminInfo"></p>

<div class="tabs">
  <div class="tab active" onclick="showTab('payments')">Payments</div>
  <div class="tab" onclick="showTab('courses')">Courses</div>
  <div class="tab" onclick="showTab('users')">Users</div>
  <div class="tab" onclick="showTab('settings')">Settings</div>
  <div class="tab" onclick="logout()" style="margin-left:auto;color:#f0566a">Sign Out</div>
</div>

<div class="section active" id="sec-payments">
  <button class="btn" onclick="loadPayments()">Refresh</button>
  <div id="paymentsTable"></div>
</div>

<div class="section" id="sec-courses">
  <button class="btn btn-green" onclick="openCourseForm()">+ New Course</button>
  <div id="coursesTable"></div>
</div>

<div class="section" id="sec-users">
  <button class="btn" onclick="loadUsers()">Refresh</button>
  <div id="usersTable"></div>
</div>

<div class="section" id="sec-settings">
  <div style="max-width:400px;background:#0b0f1a;padding:1.5rem;border-radius:8px;border:1px solid rgba(255,255,255,0.07)">
    <p style="margin-bottom:0.5rem">bKash Number</p>
    <input id="bkash" style="width:100%;padding:0.5rem;background:#111827;border:1px solid rgba(255,255,255,0.11);color:#fff;border-radius:6px;margin-bottom:1rem">
    <p style="margin-bottom:0.5rem">Nagad Number</p>
    <input id="nagad" style="width:100%;padding:0.5rem;background:#111827;border:1px solid rgba(255,255,255,0.11);color:#fff;border-radius:6px;margin-bottom:1rem">
    <label style="display:flex;align-items:center;gap:0.5rem;margin-bottom:1rem"><input type="checkbox" id="showNums" checked> Show numbers</label>
    <button class="btn" onclick="saveSettings()">Save</button>
  </div>
</div>

<script>
var T=localStorage.getItem('ega_token');
var U=JSON.parse(localStorage.getItem('ega_user')||'null');
if(!T||!U||U.role!=='admin'){location.href='/login.html'}
document.getElementById('adminInfo').textContent='Logged in as: '+U.email;

function esc(s){var d=document.createElement('div');d.textContent=String(s||'');return d.innerHTML}
function logout(){localStorage.clear();location.href='/'}

function showTab(id){
  document.querySelectorAll('.section').forEach(s=>s.classList.remove('active'));
  document.getElementById('sec-'+id).classList.add('active');
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  event.target.classList.add('active');
  if(id==='payments')loadPayments();
  if(id==='courses')loadCourses();
  if(id==='users')loadUsers();
  if(id==='settings')loadSettings();
}

async function api(method,path,body){
  var opts={method:method,headers:{'Content-Type':'application/json',Authorization:'Bearer '+T}};
  if(body)opts.body=JSON.stringify(body);
  var res=await fetch('/api'+path,opts);
  var data=await res.json();
  return{ok:res.ok,data:data};
}

// ─── PAYMENTS ───
async function loadPayments(){
  var div=document.getElementById('paymentsTable');
  div.innerHTML='Loading...';
  var r=await api('GET','/admin/enrollments');
  
  if(!r.ok){div.innerHTML='<p style="color:#f0566a">Error: '+esc(JSON.stringify(r.data))+'</p>';return}
  
  var list=r.data;
  
  // FIX: Ensure list is an array
  if(!list){list=[]}
  if(!Array.isArray(list)){
    // Maybe it's wrapped in an object
    if(list.results)list=list.results;
    else if(list.rows)list=list.rows;
    else list=[list];
  }
  
  if(list.length===0){
    div.innerHTML='<p style="color:#7a8899;padding:2rem;text-align:center">No payments yet. When a student submits payment, it will appear here.</p>';
    return;
  }
  
  var html='<table><thead><tr><th>ID</th><th>User</th><th>Course</th><th>Method</th><th>TrxID</th><th>Phone</th><th>Status</th><th>Actions</th></tr></thead><tbody>';
  
  list.forEach(function(e){
    var sc='bo';if(e.status==='approved')sc='bg';if(e.status==='spam')sc='br';
    html+='<tr>';
    html+='<td>'+e.id+'</td>';
    html+='<td>'+esc(e.user_name||'User#'+e.user_id)+'</td>';
    html+='<td>'+esc(e.course_title||'Course#'+e.course_id)+'</td>';
    html+='<td>'+esc(e.payment_method||'-')+'</td>';
    html+='<td>'+esc(e.trx_id||'-')+'</td>';
    html+='<td>'+esc(e.sender_phone||'-')+'</td>';
    html+='<td><span class="badge '+sc+'">'+esc(e.status)+'</span></td>';
    html+='<td>';
    if(e.status==='pending'){
      html+='<button class="btn btn-green" onclick="verify('+e.id+')">Verify</button> ';
      html+='<button class="btn btn-red" onclick="spam('+e.id+')">Spam</button> ';
    }
    html+='<button class="btn btn-red" onclick="del('+e.id+')">Delete</button>';
    html+='</td>';
    html+='</tr>';
  });
  
  html+='</tbody></table>';
  div.innerHTML=html;
}

async function verify(id){if(confirm('Verify?')){await api('PUT','/admin/enrollments/'+id+'/verify');loadPayments()}}
async function spam(id){if(confirm('Mark as spam?')){await api('PUT','/admin/enrollments/'+id+'/spam');loadPayments()}}
async function del(id){if(confirm('Delete?')){await api('DELETE','/admin/enrollments/'+id);loadPayments()}}

// ─── COURSES ───
async function loadCourses(){
  var div=document.getElementById('coursesTable');
  var r=await api('GET','/admin/courses');
  if(!r.ok){div.innerHTML='Error';return}
  var list=r.data||[];
  if(!list.length){div.innerHTML='<p style="color:#7a8899;padding:2rem">No courses. Create one.</p>';return}
  var html='<table><thead><tr><th>Title</th><th>Subject</th><th>Price</th><th>Actions</th></tr></thead><tbody>';
  list.forEach(function(c){
    html+='<tr><td>'+esc(c.title)+'</td><td>'+esc(c.subject_area||'-')+'</td><td>'+(c.price===0?'Free':'৳'+c.price)+'</td><td><button class="btn" onclick="editCourse('+c.id+')">Edit</button> <button class="btn btn-red" onclick="delCourse('+c.id+')">Delete</button></td></tr>';
  });
  html+='</tbody></table>';
  div.innerHTML=html;
}

function openCourseForm(course){
  var ed=!!course;
  var title=prompt('Course title:',course?course.title:'');
  if(!title)return;
  var desc=prompt('Description:',course?course.description:'');
  var subj=prompt('Subject area:',course?course.subject_area:'');
  var price=prompt('Price (0=free):',course?course.price:'0');
  var data={title:title,description:desc||'',subject_area:subj||'',difficulty:'All Levels',price:parseFloat(price)||0};
  if(ed){data.tree=course.tree;data.resources=course.resources}
  var fn=ed?api('PUT','/admin/courses/'+course.id,data):api('POST','/admin/courses',data);
  fn.then(function(r){if(r.ok)loadCourses();else alert('Failed: '+JSON.stringify(r.data))});
}
async function editCourse(id){var r=await api('GET','/courses/'+id);if(r.ok)openCourseForm(r.data)}
async function delCourse(id){if(confirm('Delete?')){await api('DELETE','/admin/courses/'+id);loadCourses()}}

// ─── USERS ───
async function loadUsers(){
  var div=document.getElementById('usersTable');
  var r=await api('GET','/admin/users');
  if(!r.ok){div.innerHTML='Error';return}
  var list=r.data||[];
  var html='<table><thead><tr><th>Name</th><th>Email</th><th>Role</th><th>Status</th><th>Actions</th></tr></thead><tbody>';
  list.forEach(function(u){
    var st=u.is_blocked?'Blocked':(u.is_approved?'Approved':'Pending');
    html+='<tr><td>'+esc(u.name)+'</td><td>'+esc(u.email)+'</td><td>'+esc(u.role)+'</td><td>'+st+'</td><td>'+
    (!u.is_approved?'<button class="btn btn-green" onclick="approve('+u.id+')">Approve</button> ':'')+
    '<button class="btn" onclick="block('+u.id+')">'+(u.is_blocked?'Unblock':'Block')+'</button> '+
    '<button class="btn btn-red" onclick="delUser('+u.id+')">Delete</button></td></tr>';
  });
  html+='</tbody></table>';
  div.innerHTML=html;
}
async function approve(id){await api('PUT','/admin/users/'+id+'/approve');loadUsers()}
async function block(id){await api('PUT','/admin/users/'+id+'/block');loadUsers()}
async function delUser(id){if(confirm('Delete?')){await api('DELETE','/admin/users/'+id);loadUsers()}}

// ─── SETTINGS ───
async function loadSettings(){
  var r=await api('GET','/admin/meta');
  if(r.ok){document.getElementById('bkash').value=r.data.bkash_number||'';document.getElementById('nagad').value=r.data.nagad_number||'';document.getElementById('showNums').checked=r.data.show_numbers!=='false'}
}
async function saveSettings(){
  await api('PUT','/admin/meta',{bkash_number:document.getElementById('bkash').value,nagad_number:document.getElementById('nagad').value,show_numbers:document.getElementById('showNums').checked?'true':'false'});
  alert('Saved');
}

loadPayments();
loadSettings();
</script>
</body>
</html>
