<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Explore Courses — Excellence Gateway Academy</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Instrument+Sans:ital,wght@0,300;0,400;0,500;1,300;1,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{
      --swatch--ivory-medium:#F5F3EE;--swatch--ivory-deep:#EDE9DF;--swatch--ivory-light:#FAF9F5;
      --swatch--slate-dark:#141413;--swatch--slate-light:#3A3936;
      --swatch--cloud-light:#C9C7BE;--swatch--cloud-medium:#8E8C86;--swatch--oat:#F0ECE2;
      --swatch--rust:#CC7853;--swatch--rust-hover:#B86A47;
      --_theme---background:var(--swatch--ivory-medium);--_theme---text:var(--swatch--slate-dark);
      --_theme---text-secondary:var(--swatch--cloud-medium);--_theme---border:rgba(20,20,19,0.12);
      --_theme---border-strong:rgba(20,20,19,0.22);--_theme---surface:var(--swatch--ivory-light);
      --_theme---accent:var(--swatch--rust);--_theme---accent-hover:var(--swatch--rust-hover);
      --font-display:'Instrument Serif',Georgia,serif;--font-body:'Instrument Sans',system-ui,sans-serif;
      --font-mono:'JetBrains Mono',monospace;--radius-s:4px;--radius-m:8px;--radius-l:12px;
      --ease-main:cubic-bezier(.4,0,.2,1);--dur-fast:150ms;--dur-main:250ms;
      --site--margin:clamp(1.5rem,4vw,5rem);--nav--height:4.25rem;
    }
    body{font-family:var(--font-body);background:var(--_theme---background);color:var(--_theme---text);min-height:100vh;display:flex;flex-direction:column;-webkit-font-smoothing:antialiased}
    a{color:inherit;text-decoration:none}button{cursor:pointer;font-family:inherit}img{max-width:100%}
    .nav_wrap{position:sticky;top:0;z-index:100;height:var(--nav--height);background:rgba(245,243,238,0.94);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);border-bottom:1px solid var(--_theme---border);display:flex;align-items:center}
    .nav_contain{width:100%;max-width:1440px;margin:0 auto;padding:0 var(--site--margin);display:flex;align-items:center;justify-content:space-between;gap:2rem}
    .nav_logo_wrap{display:flex;align-items:center;gap:0.65rem;text-decoration:none;flex-shrink:0}
    .nav_logo_wrap img{height:28px}
    .nav_logo_name{font-family:var(--font-display);font-size:1.1rem;font-weight:400;color:var(--_theme---text)}
    .nav_links{display:flex;align-items:center;gap:0.5rem;list-style:none;flex:1;justify-content:center}
    .nav_links a{font-size:0.875rem;color:var(--_theme---text);padding:0.5rem 0.9rem;transition:opacity var(--dur-fast) var(--ease-main)}
    .nav_links a:hover{opacity:0.6}
    .nav_actions{display:flex;align-items:center;gap:0.5rem;flex-shrink:0}
    .btn_main_wrap{display:inline-flex;align-items:center;border-radius:var(--radius-s);transition:all var(--dur-fast) var(--ease-main);cursor:pointer;text-decoration:none}
    .btn_main_wrap.is-nav{background:var(--swatch--slate-dark);color:var(--swatch--ivory-light);border:1px solid var(--swatch--slate-dark)}
    .btn_main_wrap.is-nav:hover{background:var(--swatch--slate-light)}
    .btn_main_wrap[data-style="tertiary"]{background:transparent;color:var(--_theme---text);border:1px solid var(--_theme---border-strong)}
    .btn_main_wrap[data-style="tertiary"]:hover{border-color:var(--_theme---text)}
    .btn_main_text{font-family:var(--font-body);font-size:0.875rem;font-weight:500;letter-spacing:0.01em;padding:0.6rem 1.25rem;line-height:1;white-space:nowrap}
    .main{flex:1;padding:3rem var(--site--margin)}
    .main-inner{max-width:1300px;margin:0 auto}
    .page-title{font-family:var(--font-display);font-size:clamp(2rem,4vw,3rem);margin-bottom:0.5rem}
    .page-sub{color:var(--_theme---text-secondary);margin-bottom:2.5rem;font-size:1.05rem}
    .filter-bar{display:flex;gap:1rem;margin-bottom:2rem;flex-wrap:wrap}
    .filter-bar input,.filter-bar select{padding:0.6rem 0.9rem;background:var(--_theme---surface);border:1px solid var(--_theme---border);border-radius:var(--radius-s);font-size:0.85rem;font-family:var(--font-body);color:var(--_theme---text);outline:none}
    .filter-bar input:focus,.filter-bar select:focus{border-color:var(--_theme---accent)}
    .filter-bar input{flex:1;min-width:200px}
    .courses-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1.5px;border:1px solid var(--_theme---border);border-radius:var(--radius-l);overflow:hidden;background:var(--_theme---border)}
    .course-card{background:var(--_theme---surface);padding:2rem;text-decoration:none;color:inherit;display:flex;flex-direction:column;gap:0.75rem;position:relative;overflow:hidden;transition:background var(--dur-main) var(--ease-main)}
    .course-card::before{content:'';position:absolute;bottom:0;left:0;right:0;height:2px;background:var(--_theme---accent);transform:scaleX(0);transform-origin:left;transition:transform var(--dur-main) var(--ease-main)}
    .course-card:hover{background:var(--swatch--oat)}.course-card:hover::before{transform:scaleX(1)}
    .course-area{font-family:var(--font-mono);font-size:0.68rem;letter-spacing:0.1em;text-transform:uppercase;color:var(--_theme---accent)}
    .course-title{font-family:var(--font-display);font-size:1.3rem;line-height:1.2}
    .course-meta{display:flex;gap:1rem;font-size:0.78rem;color:var(--_theme---text-secondary)}
    .course-desc{font-size:0.85rem;color:var(--_theme---text-secondary);line-height:1.65;flex:1}
    .course-footer{display:flex;justify-content:space-between;align-items:center;padding-top:1rem;border-top:1px solid var(--_theme---border);margin-top:auto}
    .course-price{font-family:var(--font-display);font-size:1.3rem;font-weight:300}.course-price.free{color:#16a34a}
    .course-arrow{color:var(--_theme---accent);font-size:1.1rem;transition:transform var(--dur-fast) var(--ease-main)}
    .course-card:hover .course-arrow{transform:translateX(4px)}
    .empty-state{text-align:center;padding:4rem 2rem;grid-column:1/-1;background:var(--_theme---surface)}
    .empty-state h3{font-family:var(--font-display);font-size:1.3rem;margin-bottom:0.5rem}
    .empty-state p{color:var(--_theme---text-secondary)}
    .skeleton-card{background:var(--_theme---surface);min-height:260px;background-image:linear-gradient(90deg,var(--swatch--ivory-deep) 25%,var(--swatch--cloud-light) 50%,var(--swatch--ivory-deep) 75%);background-size:400% 100%;animation:shimmer 1.8s ease-in-out infinite}
    @keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
    footer{background:var(--swatch--slate-dark);color:rgba(250,249,245,0.6);padding:3rem var(--site--margin) 2rem;margin-top:auto}
    .footer-inner{max-width:1300px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:1rem}
    .footer-logo{display:flex;align-items:center;gap:0.5rem}
    .footer-logo img{height:24px}
    .footer-logo span{font-family:var(--font-display);font-size:1rem;color:rgba(250,249,245,0.7)}
    .footer-text{font-size:0.78rem;color:rgba(250,249,245,0.4)}
    @media(max-width:900px){.courses-grid{grid-template-columns:repeat(2,1fr)}.nav_links{display:none}}
    @media(max-width:560px){.courses-grid{grid-template-columns:1fr}}
  </style>
</head>
<body>
<nav class="nav_wrap"><div class="nav_contain">
  <a href="/" class="nav_logo_wrap"><img src="/images/ega.png" height="28" alt="EGA"><span class="nav_logo_name">Excellence Gateway</span></a>
  <ul class="nav_links"><li><a href="/">Home</a></li><li><a href="/explore.html">Explore</a></li></ul>
  <div class="nav_actions" id="navActions">
    <a href="/login.html" class="btn_main_wrap" data-style="tertiary"><span class="btn_main_text">Log in</span></a>
    <a href="/signup.html" class="btn_main_wrap is-nav"><span class="btn_main_text">Get Started</span></a>
  </div>
</div></nav>

<main class="main">
  <div class="main-inner">
    <h1 class="page-title">Browse Programs</h1>
    <p class="page-sub">Explore our full catalog of structured courses.</p>
    <div class="filter-bar">
      <select id="subjectFilter" onchange="filterCourses()"><option value="">All Subjects</option></select>
      <select id="difficultyFilter" onchange="filterCourses()"><option value="">All Levels</option><option value="Beginner">Beginner</option><option value="Intermediate">Intermediate</option><option value="Advanced">Advanced</option></select>
      <input type="text" id="searchInput" placeholder="Search courses..." oninput="debounceFilter()">
    </div>
    <div class="courses-grid" id="coursesGrid"><div class="skeleton-card"></div><div class="skeleton-card"></div><div class="skeleton-card"></div></div>
  </div>
</main>

<footer>
  <div class="footer-inner">
    <a href="/" class="footer-logo"><img src="/images/ega.png" height="24" alt="EGA"><span>Excellence Gateway</span></a>
    <p class="footer-text">&copy; 2026 Excellence Gateway Academy. All rights reserved.</p>
  </div>
</footer>

<script>
function esc(s){var d=document.createElement('div');d.textContent=String(s||'');return d.innerHTML}
var token=localStorage.getItem('ega_token');
var user=JSON.parse(localStorage.getItem('ega_user')||'null');
function updateNav(){
  if(!user||!token)return;
  var init=(user.name||'U').charAt(0).toUpperCase();
  var isAdmin=user.role==='admin';
  document.getElementById('navActions').innerHTML=
    (isAdmin?'<a href="/admin.html" class="btn_main_wrap" data-style="tertiary"><span class="btn_main_text">Admin</span></a>':'')+
    '<a href="/dashboard.html" class="btn_main_wrap" data-style="tertiary"><span class="btn_main_text">Dashboard</span></a>'+
    '<button class="btn_main_wrap is-nav" onclick="logout()"><span class="btn_main_text">'+esc(init)+' &middot; Sign Out</span></button>';
}
function logout(){localStorage.removeItem('ega_token');localStorage.removeItem('ega_user');window.location.href='/'}

var allCourses=[];
async function loadCourses(){
  try{
    var res=await fetch('/api/courses?limit=100');
    allCourses=await res.json();
    var subjects=[...new Set(allCourses.map(function(c){return c.subject_area}).filter(Boolean))];
    var sf=document.getElementById('subjectFilter');
    subjects.forEach(function(s){var o=document.createElement('option');o.value=s;o.textContent=s;sf.appendChild(o)});
    renderCourses(allCourses);
  }catch(e){
    document.getElementById('coursesGrid').innerHTML='<div class="empty-state"><h3>Failed to load</h3><p><button onclick="loadCourses()" style="color:var(--_theme---accent);background:none;border:none;cursor:pointer;text-decoration:underline;font-family:inherit">Retry</button></p></div>';
  }
}
function renderCourses(courses){
  var grid=document.getElementById('coursesGrid');
  if(!courses.length){grid.innerHTML='<div class="empty-state"><h3>No courses found</h3><p>Try adjusting your filters or check back later.</p></div>';return}
  grid.innerHTML=courses.map(function(c){
    var tree=[];try{tree=typeof c.tree==='string'?JSON.parse(c.tree):(c.tree||[])}catch(e){}
    var lc=0;tree.forEach(function(s){(s.papers||[]).forEach(function(p){(p.chapters||[]).forEach(function(ch){lc+=(ch.lectures||[]).length})})});
    return'<a href="/course.html?id='+c.id+'" class="course-card"><div class="course-area">'+esc(c.subject_area||'Course')+'</div><div class="course-title">'+esc(c.title)+'</div><div class="course-meta"><span>'+lc+' lectures</span><span>'+esc(c.difficulty||'All levels')+'</span></div><div class="course-desc">'+esc(c.description||'')+'</div><div class="course-footer"><span class="course-price'+(c.price===0?' free':'')+'">'+(c.price===0?'Free':'&#2547;'+c.price)+'</span><span class="course-arrow">&rarr;</span></div></a>';
  }).join('');
}
function filterCourses(){
  var subject=document.getElementById('subjectFilter').value;
  var difficulty=document.getElementById('difficultyFilter').value;
  var search=document.getElementById('searchInput').value.toLowerCase();
  var filtered=allCourses;
  if(subject)filtered=filtered.filter(function(c){return c.subject_area===subject});
  if(difficulty)filtered=filtered.filter(function(c){return c.difficulty===difficulty});
  if(search)filtered=filtered.filter(function(c){return(c.title||'').toLowerCase().includes(search)||(c.description||'').toLowerCase().includes(search)});
  renderCourses(filtered);
}
var debounceTimer;
function debounceFilter(){clearTimeout(debounceTimer);debounceTimer=setTimeout(filterCourses,400)}

updateNav();
loadCourses();
</script>
</body>
</html>
