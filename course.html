<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Course Details — Excellence Gateway Academy</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Instrument+Sans:ital,wght@0,300;0,400;0,500;1,300;1,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{
      --swatch--ivory-medium:#F5F3EE;--swatch--ivory-light:#FAF9F5;
      --swatch--slate-dark:#141413;--swatch--slate-light:#3A3936;
      --swatch--cloud-medium:#8E8C86;--swatch--oat:#F0ECE2;
      --swatch--rust:#CC7853;--swatch--rust-hover:#B86A47;
      --_theme---background:var(--swatch--ivory-medium);--_theme---text:var(--swatch--slate-dark);
      --_theme---text-secondary:var(--swatch--cloud-medium);--_theme---border:rgba(20,20,19,0.12);
      --_theme---border-strong:rgba(20,20,19,0.22);--_theme---surface:var(--swatch--ivory-light);
      --_theme---accent:var(--swatch--rust);--_theme---accent-hover:var(--swatch--rust-hover);
      --font-display:'Instrument Serif',Georgia,serif;--font-body:'Instrument Sans',system-ui,sans-serif;
      --font-mono:'JetBrains Mono',monospace;--radius-s:4px;--radius-m:8px;--radius-l:12px;
      --ease-main:cubic-bezier(.4,0,.2,1);--dur-fast:150ms;--dur-main:250ms;
      --site--margin:clamp(1.5rem,4vw,5rem);--nav--height:4.25rem;
    }
    body{font-family:var(--font-body);background:var(--_theme---background);color:var(--_theme---text);min-height:100vh;display:flex;flex-direction:column;-webkit-font-smoothing:antialiased}
    a{color:inherit;text-decoration:none}button{cursor:pointer;font-family:inherit}
    .nav_wrap{position:sticky;top:0;z-index:100;height:var(--nav--height);background:rgba(245,243,238,0.94);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);border-bottom:1px solid var(--_theme---border);display:flex;align-items:center}
    .nav_contain{width:100%;max-width:1440px;margin:0 auto;padding:0 var(--site--margin);display:flex;align-items:center;justify-content:space-between;gap:2rem}
    .nav_logo_wrap{display:flex;align-items:center;gap:0.65rem;text-decoration:none;flex-shrink:0}
    .nav_logo_wrap img{height:28px}
    .nav_logo_name{font-family:var(--font-display);font-size:1.1rem;font-weight:400;color:var(--_theme---text)}
    .nav_actions{display:flex;align-items:center;gap:0.5rem}
    .btn_main_wrap{display:inline-flex;align-items:center;border-radius:var(--radius-s);transition:all var(--dur-fast) var(--ease-main);cursor:pointer;text-decoration:none}
    .btn_main_wrap.is-nav{background:var(--swatch--slate-dark);color:var(--swatch--ivory-light);border:1px solid var(--swatch--slate-dark)}
    .btn_main_wrap.is-nav:hover{background:var(--swatch--slate-light)}
    .btn_main_wrap[data-style="tertiary"]{background:transparent;color:var(--_theme---text);border:1px solid var(--_theme---border-strong)}
    .btn_main_wrap[data-style="tertiary"]:hover{border-color:var(--_theme---text)}
    .btn_main_wrap.is-rust{background:var(--_theme---accent);color:#fff;border:1px solid var(--_theme---accent)}
    .btn_main_wrap.is-rust:hover{background:var(--_theme---accent-hover);transform:translateY(-1px)}
    .btn_main_text{font-family:var(--font-body);font-size:0.875rem;font-weight:500;letter-spacing:0.01em;padding:0.6rem 1.25rem;line-height:1;white-space:nowrap}
    .main{flex:1;padding:2rem var(--site--margin);max-width:1100px;margin:0 auto;width:100%}
    .back-link{display:inline-flex;align-items:center;gap:0.4rem;color:var(--_theme---text-secondary);font-size:0.85rem;margin-bottom:2rem;transition:color var(--dur-fast)}.back-link:hover{color:var(--_theme---text)}
    .course-layout{display:grid;grid-template-columns:1fr 1fr;gap:3rem}
    .course-image{background:var(--_theme---surface);border:1px solid var(--_theme---border);border-radius:var(--radius-l);min-height:300px;display:flex;align-items:center;justify-content:center;overflow:hidden}
    .course-image img{width:100%;height:100%;object-fit:cover}
    .course-info h1{font-family:var(--font-display);font-size:2.2rem;line-height:1.15;margin-bottom:1rem}
    .badge{display:inline-block;font-family:var(--font-mono);font-size:0.65rem;letter-spacing:0.08em;text-transform:uppercase;padding:0.25rem 0.6rem;border-radius:4px;background:rgba(204,120,83,0.1);color:var(--_theme---accent);margin-bottom:1rem}
    .meta-row{display:flex;gap:1.5rem;flex-wrap:wrap;margin-bottom:1.5rem;font-size:0.85rem;color:var(--_theme---text-secondary)}
    .meta-row span{display:flex;align-items:center;gap:0.3rem}
    .desc{font-size:0.95rem;color:var(--_theme---text-secondary);line-height:1.7;margin-bottom:2rem}
    .price-block{display:flex;align-items:center;gap:1.5rem;padding:1.5rem;background:var(--_theme---surface);border:1px solid var(--_theme---border);border-radius:var(--radius-m);margin-bottom:2rem}
    .price{font-family:var(--font-display);font-size:2rem;font-weight:300}.price.free{color:#16a34a}
    .curriculum{margin-top:3rem;padding-top:3rem;border-top:1px solid var(--_theme---border)}
    .curriculum h2{font-family:var(--font-display);font-size:1.6rem;margin-bottom:2rem}
    .tree-item{margin-bottom:1.5rem}.tree-subject{font-weight:500;color:var(--_theme---accent);margin-bottom:0.5rem}
    .tree-paper{margin-left:1rem;font-weight:500;color:var(--_theme---text);margin-bottom:0.3rem}
    .tree-chapter{margin-left:2rem;font-size:0.9rem;color:var(--_theme---text-secondary);display:flex;align-items:center;gap:0.5rem}
    footer{background:var(--swatch--slate-dark);color:rgba(250,249,245,0.6);padding:3rem var(--site--margin) 2rem;margin-top:auto}
    .footer-inner{max-width:1300px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:1rem}
    .footer-logo{display:flex;align-items:center;gap:0.5rem}.footer-logo img{height:24px}
    .footer-logo span{font-family:var(--font-display);font-size:1rem;color:rgba(250,249,245,0.7)}
    .footer-text{font-size:0.78rem;color:rgba(250,249,245,0.4)}
    @media(max-width:768px){.course-layout{grid-template-columns:1fr;gap:1.5rem}}
  </style>
</head>
<body>
<nav class="nav_wrap"><div class="nav_contain">
  <a href="/" class="nav_logo_wrap"><img src="/images/ega.png" height="28" alt="EGA"><span class="nav_logo_name">Excellence Gateway</span></a>
  <div class="nav_actions" id="navActions">
    <a href="/login.html" class="btn_main_wrap" data-style="tertiary"><span class="btn_main_text">Log in</span></a>
    <a href="/signup.html" class="btn_main_wrap is-nav"><span class="btn_main_text">Get Started</span></a>
  </div>
</div></nav>

<main class="main">
  <a href="/explore.html" class="back-link">&larr; Back to Courses</a>
  <div id="content"><div style="text-align:center;padding:4rem;color:var(--_theme---text-secondary)">Loading course...</div></div>
</main>

<footer>
  <div class="footer-inner">
    <a href="/" class="footer-logo"><img src="/images/ega.png" height="24" alt="EGA"><span>Excellence Gateway</span></a>
    <p class="footer-text">&copy; 2026 Excellence Gateway Academy. All rights reserved.</p>
  </div>
</footer>

<script>
function esc(s){var d=document.createElement('div');d.textContent=String(s||'');return d.innerHTML}
var token=localStorage.getItem('ega_token');
var user=JSON.parse(localStorage.getItem('ega_user')||'null');
function updateNav(){
  if(!user||!token)return;
  var init=(user.name||'U').charAt(0).toUpperCase();
  var isAdmin=user.role==='admin';
  document.getElementById('navActions').innerHTML=
    (isAdmin?'<a href="/admin.html" class="btn_main_wrap" data-style="tertiary"><span class="btn_main_text">Admin</span></a>':'')+
    '<a href="/dashboard.html" class="btn_main_wrap" data-style="tertiary"><span class="btn_main_text">Dashboard</span></a>'+
    '<button class="btn_main_wrap is-nav" onclick="logout()"><span class="btn_main_text">'+esc(init)+' &middot; Sign Out</span></button>';
}
function logout(){localStorage.removeItem('ega_token');localStorage.removeItem('ega_user');window.location.href='/'}

var params=new URLSearchParams(window.location.search);
var courseId=params.get('id');

async function loadCourse(){
  if(!courseId){window.location.href='/explore.html';return}
  try{
    var res=await fetch('/api/courses/'+courseId);
    if(!res.ok)throw new Error('Not found');
    var c=await res.json();
    var tree=typeof c.tree==='string'?JSON.parse(c.tree):(c.tree||[]);
    var lc=0;tree.forEach(function(s){(s.papers||[]).forEach(function(p){(p.chapters||[]).forEach(function(ch){lc+=(ch.lectures||[]).length})})});
    document.getElementById('content').innerHTML=
      '<div class="course-layout">'+
        '<div class="course-image">'+(c.thumbnail_url?'<img src="'+esc(c.thumbnail_url)+'" alt="'+esc(c.title)+'">':'<div style="font-size:4rem;opacity:0.3">&#128218;</div>')+'</div>'+
        '<div class="course-info">'+
          (c.badge?'<span class="badge">'+esc(c.badge)+'</span>':'')+
          '<h1>'+esc(c.title)+'</h1>'+
          '<div class="meta-row"><span>'+esc(c.subject_area)+'</span><span>'+esc(c.difficulty)+'</span><span>'+lc+' lectures</span></div>'+
          '<p class="desc">'+esc(c.description||'No description available.')+'</p>'+
          '<div class="price-block"><span class="price'+(c.price===0?' free':'')+'">'+(c.price===0?'Free':'&#2547;'+c.price)+'</span>'+
            (c.price===0
              ?(user?'<a href="/learn.html?id='+c.id+'" class="btn_main_wrap is-rust"><span class="btn_main_text">Start Learning</span></a>':'<a href="/login.html" class="btn_main_wrap is-nav"><span class="btn_main_text">Sign In to Start</span></a>')
              :(user?'<a href="/payment.html?id='+c.id+'" class="btn_main_wrap is-rust"><span class="btn_main_text">Enroll Now</span></a>':'<a href="/login.html" class="btn_main_wrap is-nav"><span class="btn_main_text">Sign In to Enroll</span></a>')
            )+
          '</div>'+
        '</div>'+
      '</div>'+
      (tree.length?'<div class="curriculum"><h2>Curriculum</h2>'+tree.map(function(s){return'<div class="tree-item"><div class="tree-subject">'+esc(s.name)+'</div>'+(s.papers||[]).map(function(p){return'<div class="tree-paper">'+esc(p.name)+'</div>'+(p.chapters||[]).map(function(ch){return'<div class="tree-chapter"><span>&#9654;</span>'+esc(ch.title)+' <span style="font-size:0.75rem">('+(ch.lectures||[]).length+' lectures)</span></div>'}).join('')}).join('')+'</div>'}).join('')+'</div>':'');
  }catch(e){
    document.getElementById('content').innerHTML='<div style="text-align:center;padding:4rem"><p style="color:#dc2626">Course not found.</p><a href="/explore.html" style="color:var(--_theme---accent)">Browse courses</a></div>';
  }
}

updateNav();
loadCourse();
</script>
</body>
</html>
