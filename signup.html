<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account — Excellence Gateway Academy</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{
      --bg:#05080f;--surface:#0b0f1a;--surface2:#111827;--surface3:#161e2e;
      --border:rgba(255,255,255,0.07);--border2:rgba(255,255,255,0.11);
      --accent:#C9A84C;--accent2:#b8942f;--accent-dim:rgba(201,168,76,0.08);
      --white:#f0f4f8;--gray:#7a8899;--gray2:#a0adb8;
      --red:#f0566a;--red-dim:rgba(240,86,106,0.09);
      --green:#10d48e;--green-dim:rgba(16,212,142,0.09);
      --orange:#f59e0b;--orange-dim:rgba(245,158,11,0.09);
      --radius:9px;--radius-lg:13px;
      --transition:.18s cubic-bezier(.4,0,.2,1)
    }
    body{
      font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--white);
      min-height:100vh;display:flex;align-items:center;justify-content:center;
      padding:2rem;
    }
    .auth-container{width:100%;max-width:480px}
    .auth-logo{text-align:center;margin-bottom:2rem}
    .auth-logo img{height:40px}
    .auth-logo h1{
      font-family:'Cormorant Garamond',serif;font-size:1.8rem;font-weight:400;
      margin-top:0.8rem
    }
    .auth-logo h1 em{font-style:italic;color:var(--accent)}
    .auth-card{
      background:var(--surface);border:1px solid var(--border);
      border-radius:var(--radius-lg);padding:2rem
    }
    .auth-tabs{display:flex;margin-bottom:1.5rem;border-bottom:1px solid var(--border)}
    .auth-tab{
      flex:1;text-align:center;padding:0.8rem;font-size:0.9rem;font-weight:500;
      color:var(--gray);cursor:pointer;border-bottom:2px solid transparent;
      transition:all var(--transition);background:none;border-top:none;border-left:none;border-right:none;
      font-family:'DM Sans',sans-serif
    }
    .auth-tab.active{color:var(--accent);border-bottom-color:var(--accent)}
    .form-group{margin-bottom:1rem}
    .form-group label{display:block;font-size:0.82rem;color:var(--gray2);margin-bottom:0.4rem;font-weight:500}
    .form-group input{
      width:100%;padding:0.75rem 1rem;
      background:var(--surface2);border:1px solid var(--border);
      border-radius:var(--radius);color:var(--white);font-size:0.9rem;
      font-family:'DM Sans',sans-serif;transition:border var(--transition);outline:none
    }
    .form-group input:focus{border-color:var(--accent)}
    .form-group input.error{border-color:var(--red)}
    .form-row{display:grid;grid-template-columns:1fr 1fr;gap:0.8rem}
    .alert{
      padding:0.8rem 1rem;border-radius:var(--radius);font-size:0.82rem;
      margin-bottom:1rem;display:none
    }
    .alert-error{background:var(--red-dim);border:1px solid var(--red);color:var(--red);display:block}
    .alert-success{background:var(--green-dim);border:1px solid var(--green);color:var(--green);display:block}
    .alert-warning{background:var(--orange-dim);border:1px solid var(--orange);color:var(--orange);display:block}
    .btn{
      width:100%;padding:0.85rem;font-size:0.9rem;font-weight:500;
      border-radius:var(--radius);border:none;cursor:pointer;
      font-family:'DM Sans',sans-serif;transition:all var(--transition);
      display:flex;align-items:center;justify-content:center;gap:0.5rem
    }
    .btn-primary{background:var(--accent);color:#05080f}
    .btn-primary:hover{background:var(--accent2)}
    .btn-primary:disabled{opacity:0.5;cursor:not-allowed}
    .spinner{
      width:18px;height:18px;border:2px solid transparent;
      border-top-color:#05080f;border-radius:50%;
      animation:spin 0.6s linear infinite;display:none
    }
    .btn-loading .spinner{display:block}
    .btn-loading .btn-text{display:none}
    .auth-footer{text-align:center;margin-top:1.5rem;font-size:0.85rem;color:var(--gray)}
    .auth-footer a{color:var(--accent);text-decoration:none}
    .auth-footer a:hover{text-decoration:underline}
    .back-link{display:block;text-align:center;margin-top:1rem;color:var(--gray);font-size:0.85rem;text-decoration:none}
    .back-link:hover{color:var(--white)}
    .success-state{text-align:center;padding:2rem 0;display:none}
    .success-state svg{margin-bottom:1rem}
    .success-state h3{font-family:'Cormorant Garamond',serif;font-size:1.5rem;margin-bottom:0.5rem}
    .success-state p{color:var(--gray);font-size:0.9rem;line-height:1.6}
    @keyframes spin{to{transform:rotate(360deg)}}
    @media(max-width:480px){.auth-card{padding:1.5rem}.form-row{grid-template-columns:1fr}}
  </style>
</head>
<body>
<div class="auth-container">
  <a href="/" class="auth-logo" style="text-decoration:none">
    <img src="/images/ega.png" height="40" alt="EGA">
    <h1>Excellence <em>Gateway</em></h1>
  </a>
  <div class="auth-card">
    <div class="auth-tabs">
      <button class="auth-tab" onclick="window.location.href='/login.html'">Sign In</button>
      <button class="auth-tab active" onclick="switchTab('signup')">Create Account</button>
    </div>
    <div id="formArea">
      <div id="alert"></div>
      <form id="signupForm" onsubmit="handleSignup(event)">
        <div class="form-group">
          <label for="name">Full Name</label>
          <input type="text" id="name" placeholder="Your full name" required>
        </div>
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" placeholder="you@example.com" required>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label for="phone">Phone (optional)</label>
            <input type="tel" id="phone" placeholder="01XXXXXXXXX">
          </div>
          <div class="form-group">
            <label for="institution">Institution (optional)</label>
            <input type="text" id="institution" placeholder="Your institution">
          </div>
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" placeholder="Min 6 characters" required minlength="6">
        </div>
        <div class="form-group">
          <label for="confirmPassword">Confirm Password</label>
          <input type="password" id="confirmPassword" placeholder="Re-enter password" required minlength="6">
        </div>
        <button type="submit" class="btn btn-primary" id="signupBtn">
          <span class="btn-text">Create Account</span>
          <span class="spinner"></span>
        </button>
      </form>
    </div>
    <div class="success-state" id="successState">
      <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="16 10 12 14 8 10"/></svg>
      <h3>Account Created</h3>
      <p>Your account is ready. You can now <a href="/login.html" style="color:var(--accent)">sign in</a> and start exploring courses.</p>
    </div>
  </div>
  <p class="auth-footer">Already have an account? <a href="/login.html">Sign in</a></p>
  <a href="/" class="back-link">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg>
    Back to Home
  </a>
</div>

<script>
function esc(s){const d=document.createElement('div');d.textContent=String(s||'');return d.innerHTML}
function showAlert(msg,type='error'){const a=document.getElementById('alert');a.textContent=msg;a.className='alert alert-'+type;setTimeout(()=>a.className='alert',5000)}
function hideAlert(){document.getElementById('alert').className='alert'}

function deviceFingerprint(){
  const d=[navigator.hardwareConcurrency,navigator.deviceMemory,screen.width+'x'+screen.height,navigator.language,navigator.platform];
  return d.join('|');
}

function setLoading(loading){
  const btn=document.getElementById('signupBtn');
  if(loading){btn.classList.add('btn-loading');btn.disabled=true}
  else{btn.classList.remove('btn-loading');btn.disabled=false}
}

async function handleSignup(e){
  e.preventDefault();hideAlert();
  const name=document.getElementById('name').value.trim();
  const email=document.getElementById('email').value.trim();
  const phone=document.getElementById('phone').value.trim();
  const institution=document.getElementById('institution').value.trim();
  const password=document.getElementById('password').value;
  const confirmPassword=document.getElementById('confirmPassword').value;

  if(!name||!email||!password)return showAlert('Name, email, and password required');
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email))return showAlert('Invalid email format');
  if(phone&&!/^01\d{9}$/.test(phone))return showAlert('Phone must be 01XXXXXXXXX format');
  if(password.length<6)return showAlert('Password must be at least 6 characters');
  if(password!==confirmPassword)return showAlert('Passwords do not match');

  setLoading(true);
  try{
    const res=await fetch('/api/auth/signup',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({name,email,password,phone,institution,device_fingerprint:deviceFingerprint()})
    });
    const data=await res.json();
    if(!res.ok){showAlert(data.error||'Signup failed');setLoading(false);return}
    document.getElementById('formArea').style.display='none';
    document.getElementById('successState').style.display='block';
  }catch(e){showAlert('Network error. Please try again.');setLoading(false)}
}
</script>
</body>
</html>
