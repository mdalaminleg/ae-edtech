<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard — Excellence Gateway Academy</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Instrument+Sans:ital,wght@0,300;0,400;0,500;1,300;1,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{
      --swatch--ivory-medium:#F5F3EE;--swatch--ivory-deep:#EDE9DF;--swatch--ivory-light:#FAF9F5;
      --swatch--slate-dark:#141413;--swatch--slate-light:#3A3936;
      --swatch--cloud-light:#C9C7BE;--swatch--cloud-medium:#8E8C86;--swatch--oat:#F0ECE2;
      --swatch--rust:#CC7853;--swatch--rust-hover:#B86A47;
      --_theme---background:var(--swatch--ivory-medium);--_theme---text:var(--swatch--slate-dark);
      --_theme---text-secondary:var(--swatch--cloud-medium);--_theme---border:rgba(20,20,19,0.12);
      --_theme---border-strong:rgba(20,20,19,0.22);--_theme---surface:var(--swatch--ivory-light);
      --_theme---accent:var(--swatch--rust);--_theme---accent-dim:rgba(204,120,83,0.1);
      --font-display:'Instrument Serif',Georgia,serif;--font-body:'Instrument Sans',system-ui,sans-serif;
      --font-mono:'JetBrains Mono',monospace;--radius-s:4px;--radius-m:8px;--radius-l:12px;
      --ease-main:cubic-bezier(.4,0,.2,1);--dur-fast:150ms;--dur-main:250ms;
      --site--margin:clamp(1.5rem,4vw,5rem);--nav--height:4.25rem;
    }
    body{font-family:var(--font-body);background:var(--_theme---background);color:var(--_theme---text);min-height:100vh;display:flex;flex-direction:column;-webkit-font-smoothing:antialiased}
    a{color:inherit;text-decoration:none}button{cursor:pointer;font-family:inherit}
    .nav_wrap{position:sticky;top:0;z-index:100;height:var(--nav--height);background:rgba(245,243,238,0.94);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);border-bottom:1px solid var(--_theme---border);display:flex;align-items:center}
    .nav_contain{width:100%;max-width:1440px;margin:0 auto;padding:0 var(--site--margin);display:flex;align-items:center;justify-content:space-between;gap:2rem}
    .nav_logo_wrap{display:flex;align-items:center;gap:0.65rem;text-decoration:none}.nav_logo_wrap img{height:28px}
    .nav_logo_name{font-family:var(--font-display);font-size:1.1rem;font-weight:400;color:var(--_theme---text)}
    .nav_actions{display:flex;align-items:center;gap:0.5rem}
    .btn_main_wrap{display:inline-flex;align-items:center;border-radius:var(--radius-s);transition:all var(--dur-fast) var(--ease-main);cursor:pointer;text-decoration:none}
    .btn_main_wrap.is-nav{background:var(--swatch--slate-dark);color:var(--swatch--ivory-light);border:1px solid var(--swatch--slate-dark)}
    .btn_main_wrap.is-nav:hover{background:var(--swatch--slate-light)}
    .btn_main_wrap[data-style="tertiary"]{background:transparent;color:var(--_theme---text);border:1px solid var(--_theme---border-strong)}
    .btn_main_wrap[data-style="tertiary"]:hover{border-color:var(--_theme---text)}
    .btn_main_text{font-family:var(--font-body);font-size:0.875rem;font-weight:500;letter-spacing:0.01em;padding:0.6rem 1.25rem;line-height:1;white-space:nowrap}
    .main{flex:1;padding:3rem var(--site--margin);max-width:1100px;margin:0 auto;width:100%}
    .welcome{display:flex;justify-content:space-between;align-items:center;margin-bottom:2rem;flex-wrap:wrap;gap:1rem}
    .welcome h1{font-family:var(--font-display);font-size:2rem}.welcome h1 span{color:var(--_theme---accent)}
    .stats-row{display:grid;grid-template-columns:repeat(3,1fr);gap:1rem;margin-bottom:2.5rem}
    .stat-card{background:var(--_theme---surface);border:1px solid var(--_theme---border);border-radius:var(--radius-m);padding:1.5rem}
    .stat-label{font-family:var(--font-mono);font-size:0.65rem;letter-spacing:0.1em;text-transform:uppercase;color:var(--_theme---text-secondary);margin-bottom:0.5rem}
    .stat-value{font-family:var(--font-display);font-size:2.5rem;color:var(--_theme---accent)}
    .section-title{font-family:var(--font-display);font-size:1.5rem;margin-bottom:1.5rem}
    .courses-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1.5px;border:1px solid var(--_theme---border);border-radius:var(--radius-l);overflow:hidden;background:var(--_theme---border)}
    .course-card{background:var(--_theme---surface);padding:1.5rem;text-decoration:none;color:inherit;display:flex;flex-direction:column;gap:0.5rem;transition:background var(--dur-main) var(--ease-main)}
    .course-card:hover{background:var(--swatch--oat)}
    .course-area{font-family:var(--font-mono);font-size:0.65rem;letter-spacing:0.1em;text-transform:uppercase;color:var(--_theme---accent)}
    .course-title{font-family:var(--font-display);font-size:1.2rem;line-height:1.2}
    .expiry-badge{display:inline-block;font-size:0.68rem;padding:0.2rem 0.6rem;border-radius:20px;font-weight:500;width:fit-content}
    .expiry-green{background:rgba(34,197,94,0.1);color:#16a34a}.expiry-orange{background:rgba(245,158,11,0.1);color:#d97706}.expiry-red{background:rgba(220,38,38,0.08);color:#dc2626}
    .empty-state{text-align:center;padding:4rem 2rem;grid-column:1/-1;background:var(--_theme---surface)}
    .empty-state h3{font-family:var(--font-display);font-size:1.3rem;margin-bottom:0.5rem}
    .empty-state p{color:var(--_theme---text-secondary);margin-bottom:1.5rem}
    footer{background:var(--swatch--slate-dark);color:rgba(250,249,245,0.6);padding:3rem var(--site--margin) 2rem;margin-top:auto}
    .footer-inner{max-width:1300px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:1rem}
    .footer-logo{display:flex;align-items:center;gap:0.5rem}.footer-logo img{height:24px}
    .footer-logo span{font-family:var(--font-display);font-size:1rem;color:rgba(250,249,245,0.7)}
    .footer-text{font-size:0.78rem;color:rgba(250,249,245,0.4)}
    @media(max-width:768px){.courses-grid,.stats-row{grid-template-columns:1fr}}
  </style>
</head>
<body>
<nav class="nav_wrap"><div class="nav_contain">
  <a href="/" class="nav_logo_wrap"><img src="/images/ega.png" height="28" alt="EGA"><span class="nav_logo_name">Excellence Gateway</span></a>
  <div class="nav_actions" id="navActions"></div>
</div></nav>

<main class="main">
  <div class="welcome"><h1>Welcome, <span id="userName">Student</span></h1><a href="/explore.html" class="btn_main_wrap is-nav"><span class="btn_main_text">Browse Courses</span></a></div>
  <div class="stats-row">
    <div class="stat-card"><div class="stat-label">Enrolled Courses</div><div class="stat-value" id="sEnrolled">0</div></div>
    <div class="stat-card"><div class="stat-label">Active Memberships</div><div class="stat-value" id="sActive">0</div></div>
    <div class="stat-card"><div class="stat-label">Expiring Soon</div><div class="stat-value" id="sExpiring">0</div></div>
  </div>
  <h2 class="section-title">My Courses</h2>
  <div class="courses-grid" id="coursesGrid"><div style="padding:3rem;text-align:center;color:var(--_theme---text-secondary);grid-column:1/-1">Loading...</div></div>
</main>

<footer>
  <div class="footer-inner">
    <a href="/" class="footer-logo"><img src="/images/ega.png" height="24" alt="EGA"><span>Excellence Gateway</span></a>
    <p class="footer-text">&copy; 2026 Excellence Gateway Academy. All rights reserved.</p>
  </div>
</footer>

<script>
function esc(s){var d=document.createElement('div');d.textContent=String(s||'');return d.innerHTML}
var token=localStorage.getItem('ega_token');
var user=JSON.parse(localStorage.getItem('ega_user')||'null');
if(!token||!user){window.location.href='/login.html'}
if(user.role==='admin'){window.location.href='/admin.html'}

document.getElementById('userName').textContent=user.name;
document.getElementById('navActions').innerHTML=
  '<a href="/dashboard.html" class="btn_main_wrap" data-style="tertiary"><span class="btn_main_text">Dashboard</span></a>'+
  '<button class="btn_main_wrap is-nav" onclick="logout()"><span class="btn_main_text">'+(user.name||'U').charAt(0).toUpperCase()+' &middot; Sign Out</span></button>';
function logout(){localStorage.clear();window.location.href='/'}

async function loadDashboard(){
  try{
    var res=await fetch('/api/user/enrollments',{headers:{'Authorization':'Bearer '+token}});
    var enrollments=await res.json();
    var now=new Date(),active=0,expiring=0;
    enrollments.forEach(function(e){
      if(e.expires_at){var exp=new Date(e.expires_at);if(exp>now){active++;var days=Math.ceil((exp-now)/(1000*60*60*24));if(days<=30)expiring++}}
    });
    document.getElementById('sEnrolled').textContent=enrollments.length;
    document.getElementById('sActive').textContent=active;
    document.getElementById('sExpiring').textContent=expiring;
    var grid=document.getElementById('coursesGrid');
    if(!enrollments.length){grid.innerHTML='<div class="empty-state"><h3>No courses yet</h3><p>Browse our catalog and enroll in your first course.</p><a href="/explore.html" class="btn_main_wrap is-nav"><span class="btn_main_text">Browse Courses</span></a></div>';return}
    grid.innerHTML=enrollments.map(function(e){
      var badge='expiry-green',badgeText='Active';
      if(e.expires_at){var exp=new Date(e.expires_at);if(exp<=now){badge='expiry-red';badgeText='Expired'}else{var days=Math.ceil((exp-now)/(1000*60*60*24));if(days<=30){badge='expiry-orange';badgeText=days+' days left'}}}
      return'<a href="/learn.html?id='+e.course_id+'" class="course-card"><div class="course-area">'+esc(e.subject_area||'Course')+'</div><div class="course-title">'+esc(e.course_title)+'</div><span class="expiry-badge '+badge+'">'+badgeText+'</span><div><span class="btn_main_text" style="color:var(--_theme---accent);padding:0">Continue Learning &rarr;</span></div></a>';
    }).join('');
  }catch(e){
    document.getElementById('coursesGrid').innerHTML='<div class="empty-state"><h3>Failed to load</h3><p><button onclick="loadDashboard()" style="color:var(--_theme---accent);background:none;border:none;cursor:pointer;text-decoration:underline;font-family:inherit">Retry</button></p></div>';
  }
}

loadDashboard();
</script>
</body>
</html>
