<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Learn — Excellence Gateway Academy</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Instrument+Sans:ital,wght@0,300;0,400;0,500;1,300;1,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{
      --swatch--ivory-medium:#F5F3EE;--swatch--ivory-light:#FAF9F5;
      --swatch--slate-dark:#141413;--swatch--slate-light:#3A3936;
      --swatch--cloud-medium:#8E8C86;--swatch--oat:#F0ECE2;
      --swatch--rust:#CC7853;--swatch--rust-hover:#B86A47;
      --_theme---background:var(--swatch--ivory-medium);--_theme---text:var(--swatch--slate-dark);
      --_theme---text-secondary:var(--swatch--cloud-medium);--_theme---border:rgba(20,20,19,0.12);
      --_theme---surface:var(--swatch--ivory-light);--_theme---accent:var(--swatch--rust);
      --_theme---accent-dim:rgba(204,120,83,0.08);
      --font-display:'Instrument Serif',Georgia,serif;--font-body:'Instrument Sans',system-ui,sans-serif;
      --font-mono:'JetBrains Mono',monospace;--radius-s:4px;--radius-m:8px;--radius-l:12px;
      --ease-main:cubic-bezier(.4,0,.2,1);--dur-fast:150ms;--dur-main:250ms;
      --nav--height:3.5rem;--sidebar-width:300px;
    }
    body{font-family:var(--font-body);background:var(--_theme---background);color:var(--_theme---text);height:100vh;overflow:hidden;display:flex;flex-direction:column;-webkit-font-smoothing:antialiased}
    a{color:inherit;text-decoration:none}button{cursor:pointer;font-family:inherit}
    
    .topbar{height:var(--nav--height);background:var(--_theme---surface);border-bottom:1px solid var(--_theme---border);display:flex;align-items:center;padding:0 1.5rem;gap:1rem;flex-shrink:0;z-index:50}
    .topbar-back{color:var(--_theme---text-secondary);font-size:0.85rem;transition:color var(--dur-fast);display:flex;align-items:center;gap:0.3rem}
    .topbar-back:hover{color:var(--_theme---text)}
    .topbar-title{font-family:var(--font-display);font-size:1.1rem;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .topbar-meta{font-size:0.75rem;color:var(--_theme---text-secondary);white-space:nowrap}
    
    .layout{display:flex;flex:1;overflow:hidden}
    
    .sidebar{width:var(--sidebar-width);min-width:var(--sidebar-width);background:var(--_theme---surface);border-right:1px solid var(--_theme---border);overflow-y:auto;padding:1rem 0;transition:transform var(--dur-main) var(--ease-main)}
    .sidebar-btn{display:none;background:none;border:none;color:var(--_theme---text);padding:0.5rem;cursor:pointer}
    
    .main-content{flex:1;overflow-y:auto;padding:2rem}
    
    .tree-subject{padding:0.7rem 1.2rem;font-weight:500;color:var(--_theme---accent);cursor:pointer;display:flex;align-items:center;gap:0.5rem;font-size:0.9rem;border-left:3px solid transparent;transition:all var(--dur-fast);user-select:none}
    .tree-subject:hover{background:var(--_theme---accent-dim)}
    .tree-subject.open{border-left-color:var(--_theme---accent);background:var(--_theme---accent-dim)}
    .tree-subject .arrow{width:12px;height:12px;transition:transform var(--dur-fast);flex-shrink:0}
    .tree-subject.open .arrow{transform:rotate(90deg)}
    .tree-subject .icon{font-size:1.1rem;flex-shrink:0}
    
    .tree-children{display:none}
    .tree-subject.open+.tree-children{display:block}
    
    .tree-paper{padding:0.5rem 1.2rem 0.5rem 2.5rem;font-weight:500;color:var(--_theme---text);cursor:pointer;display:flex;align-items:center;gap:0.4rem;font-size:0.85rem;border-left:3px solid transparent;transition:all var(--dur-fast);user-select:none}
    .tree-paper:hover{background:var(--_theme---accent-dim)}
    .tree-paper.open{border-left-color:var(--_theme---accent)}
    .tree-paper .arrow{width:10px;height:10px;transition:transform var(--dur-fast);flex-shrink:0}
    .tree-paper.open .arrow{transform:rotate(90deg)}
    
    .tree-chapter{padding:0.4rem 1.2rem 0.4rem 3.5rem;font-size:0.82rem;color:var(--_theme---text-secondary);cursor:pointer;display:flex;align-items:center;gap:0.5rem;border-left:3px solid transparent;transition:all var(--dur-fast);user-select:none}
    .tree-chapter:hover{color:var(--_theme---text);background:var(--_theme---accent-dim)}
    .tree-chapter.active{color:var(--_theme---accent);border-left-color:var(--_theme---accent);background:var(--_theme---accent-dim);font-weight:500}
    .tree-chapter .dot{width:7px;height:7px;border-radius:50%;background:var(--_theme---text-secondary);flex-shrink:0}
    .tree-chapter .count{font-size:0.7rem;color:var(--_theme---text-secondary);margin-left:auto}
    
    .breadcrumb{font-size:0.8rem;color:var(--_theme---text-secondary);margin-bottom:1.5rem;display:flex;align-items:center;gap:0.3rem;flex-wrap:wrap}
    .breadcrumb span{color:var(--_theme---text)}
    
    .lecture-list{display:flex;flex-direction:column;gap:0.6rem}
    .lecture-row{display:flex;align-items:center;gap:1rem;padding:1rem 1.2rem;background:var(--_theme---surface);border:1px solid var(--_theme---border);border-radius:var(--radius-m);transition:all var(--dur-fast);text-decoration:none;color:inherit}
    .lecture-row:hover{border-color:var(--_theme---accent);transform:translateX(3px);box-shadow:0 2px 12px rgba(0,0,0,0.04)}
    .lecture-num{font-family:var(--font-display);font-size:1.3rem;color:var(--_theme---accent);min-width:35px;text-align:center}
    .lecture-info{flex:1;min-width:0}
    .lecture-title{font-weight:500;font-size:0.9rem;margin-bottom:0.2rem}
    .lecture-meta{font-size:0.72rem;color:var(--_theme---text-secondary)}
    .lecture-actions{display:flex;gap:0.4rem;align-items:center;flex-shrink:0}
    .pdf-link{display:inline-flex;align-items:center;gap:0.3rem;background:var(--_theme---accent-dim);color:var(--_theme---accent);padding:0.3rem 0.7rem;border-radius:var(--radius-s);font-size:0.7rem;font-weight:500;text-decoration:none;transition:all var(--dur-fast);white-space:nowrap}
    .pdf-link:hover{background:var(--_theme---accent);color:#fff}
    .pdf-link svg{width:12px;height:12px;flex-shrink:0}
    
    .empty-state{text-align:center;padding:4rem 2rem;color:var(--_theme---text-secondary)}
    .empty-state svg{margin-bottom:1rem;color:var(--_theme---text-secondary);opacity:0.3}
    .empty-state h3{font-family:var(--font-display);font-size:1.3rem;margin-bottom:0.5rem;color:var(--_theme---text)}
    .empty-state p{font-size:0.9rem;margin-bottom:1.5rem}
    
    .section-divider{border-top:1px solid var(--_theme---border);margin:2rem 0;padding-top:1.5rem}
    .section-divider h4{font-family:var(--font-display);font-size:1.1rem;margin-bottom:1rem}
    .resource-link{display:flex;align-items:center;gap:0.5rem;color:var(--_theme---accent);text-decoration:none;padding:0.5rem 0;font-size:0.85rem;transition:all var(--dur-fast)}
    .resource-link:hover{text-decoration:underline;transform:translateX(3px)}
    .resource-link svg{width:16px;height:16px;flex-shrink:0}
    
    .sidebar-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.3);z-index:40}
    
    .skeleton{background:linear-gradient(90deg,var(--swatch--ivory-medium) 25%,var(--swatch--oat) 50%,var(--swatch--ivory-medium) 75%);background-size:200% 100%;animation:shimmer 1.5s infinite;border-radius:var(--radius-s);height:1rem;margin-bottom:0.5rem}
    @keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
    
    @media(max-width:768px){
      .sidebar{position:fixed;left:calc(-1*var(--sidebar-width));top:var(--nav--height);bottom:0;z-index:50;box-shadow:4px 0 20px rgba(0,0,0,0.1)}
      .sidebar.open{left:0}
      .sidebar-overlay.show{display:block}
      .sidebar-btn{display:flex}
      .main-content{padding:1.5rem}
      .lecture-row{flex-wrap:wrap}
    }
  </style>
</head>
<body>

<div class="topbar">
  <button class="sidebar-btn" id="sidebarToggle" aria-label="Menu">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
  </button>
  <a href="/dashboard.html" class="topbar-back">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg>
    Dashboard
  </a>
  <span class="topbar-title" id="courseName">Loading...</span>
  <span class="topbar-meta" id="courseMeta"></span>
</div>

<div class="layout">
  <div class="sidebar-overlay" id="sidebarOverlay"></div>
  <aside class="sidebar" id="sidebar">
    <div style="padding:1rem 1.2rem;color:var(--_theme---text-secondary);font-size:0.8rem">Loading tree...</div>
  </aside>
  <main class="main-content" id="mainContent">
    <div style="text-align:center;padding:4rem">
      <div class="skeleton" style="width:60%;margin:0 auto 1rem"></div>
      <div class="skeleton" style="width:40%;margin:0 auto 1rem"></div>
      <div class="skeleton" style="width:80%;margin:0 auto"></div>
    </div>
  </main>
</div>

<script>
function esc(s){var d=document.createElement('div');d.textContent=String(s||'');return d.innerHTML}

var token=localStorage.getItem('ega_token');
var user=JSON.parse(localStorage.getItem('ega_user')||'null');
if(!token||!user){window.location.href='/login.html'}

var params=new URLSearchParams(window.location.search);
var courseId=params.get('id');
var courseData=null;
var treeMap={};

// Mobile sidebar
document.getElementById('sidebarToggle').addEventListener('click',function(){
  document.getElementById('sidebar').classList.add('open');
  document.getElementById('sidebarOverlay').classList.add('show');
});
document.getElementById('sidebarOverlay').addEventListener('click',function(){
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('sidebarOverlay').classList.remove('show');
});

function buildSidebar(tree){
  if(!tree||!tree.length){
    return '<div style="padding:2rem 1.2rem;color:var(--_theme---text-secondary);font-size:0.85rem;text-align:center">No curriculum added yet.</div>';
  }
  
  return tree.map(function(s,si){
    var lectureCount=0;
    (s.papers||[]).forEach(function(p){(p.chapters||[]).forEach(function(ch){lectureCount+=(ch.lectures||[]).length})});
    
    return '<div class="tree-subject" onclick="toggleTreeNode(this)" data-type="subject">'+
      '<svg class="arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"/></svg>'+
      '<span class="icon">&#128218;</span>'+
      esc(s.name)+
      ' <span style="font-size:0.7rem;color:var(--_theme---text-secondary);margin-left:auto">'+lectureCount+' lec</span>'+
    '</div>'+
    '<div class="tree-children">'+
    (s.papers||[]).map(function(p,pi){
      var paperLecCount=0;
      (p.chapters||[]).forEach(function(ch){paperLecCount+=(ch.lectures||[]).length});
      
      return '<div class="tree-paper" onclick="toggleTreeNode(this)" data-type="paper">'+
        '<svg class="arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"/></svg>'+
        esc(p.name)+
        ' <span style="font-size:0.7rem;color:var(--_theme---text-secondary);margin-left:auto">'+paperLecCount+' lec</span>'+
      '</div>'+
      '<div class="tree-children">'+
      (p.chapters||[]).map(function(ch,ci){
        var chId='ch_'+si+'_'+pi+'_'+ci;
        return '<div class="tree-chapter" data-chapter="'+chId+'" onclick="selectChapter(\''+chId+'\')">'+
          '<span class="dot"></span>'+
          esc(ch.title)+
          '<span class="count">'+(ch.lectures||[]).length+' lectures</span>'+
        '</div>';
      }).join('')+
      '</div>';
    }).join('')+
    '</div>';
  }).join('');
}

function toggleTreeNode(el){
  el.classList.toggle('open');
  // Don't let paper toggle close the subject
  event.stopPropagation();
}

function buildTreeMap(tree){
  treeMap={};
  tree.forEach(function(s,si){
    (s.papers||[]).forEach(function(p,pi){
      (p.chapters||[]).forEach(function(ch,ci){
        var key='ch_'+si+'_'+pi+'_'+ci;
        treeMap[key]={subject:s,paper:p,chapter:ch,si:si,pi:pi,ci:ci};
      });
    });
  });
}

function selectChapter(key){
  var data=treeMap[key];
  if(!data)return;
  
  // Highlight active chapter
  document.querySelectorAll('.tree-chapter').forEach(function(el){el.classList.remove('active')});
  var activeEl=document.querySelector('[data-chapter="'+key+'"]');
  if(activeEl)activeEl.classList.add('active');
  
  // Ensure parent subject and paper are open
  var parentPaper=activeEl?.parentElement?.previousElementSibling;
  if(parentPaper)parentPaper.classList.add('open');
  var parentSubject=parentPaper?.parentElement?.previousElementSibling;
  if(parentSubject)parentSubject.classList.add('open');
  
  renderChapter(data);
  
  // Close mobile sidebar
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('sidebarOverlay').classList.remove('show');
}

function renderChapter(data){
  var s=data.subject,p=data.paper,ch=data.chapter;
  var lectures=ch.lectures||[];
  
  var html='';
  
  // Breadcrumb
  html+='<div class="breadcrumb">';
  html+='<a href="#" style="color:var(--_theme---text-secondary)" onclick="document.getElementById(\'sidebar\').classList.add(\'open\')">'+esc(s.name)+'</a>';
  html+='<span>/</span>';
  html+='<a href="#" style="color:var(--_theme---text-secondary)" onclick="document.getElementById(\'sidebar\').classList.add(\'open\')">'+esc(p.name)+'</a>';
  html+='<span>/</span>';
  html+='<span>'+esc(ch.title)+'</span>';
  html+='</div>';
  
  // Chapter heading
  html+='<h2 style="font-family:var(--font-display);font-size:1.6rem;margin-bottom:0.5rem">'+esc(ch.title)+'</h2>';
  html+='<p style="color:var(--_theme---text-secondary);font-size:0.85rem;margin-bottom:2rem">'+esc(p.name)+' &middot; '+esc(s.name)+' &middot; '+lectures.length+' lecture'+(lectures.length!==1?'s':'')+'</p>';
  
  // Lectures
  if(lectures.length){
    html+='<div class="lecture-list">';
    lectures.forEach(function(l,i){
      html+='<a href="/watch.html?courseId='+courseId+'&lectureId='+encodeURIComponent(l.yt_video_id||l.id)+'&title='+encodeURIComponent(l.title)+'" class="lecture-row">';
      html+='<div class="lecture-num">'+String(i+1).padStart(2,'0')+'</div>';
      html+='<div class="lecture-info">';
      html+='<div class="lecture-title">'+esc(l.title)+'</div>';
      html+='<div class="lecture-meta">'+esc(ch.title)+' &middot; '+esc(p.name)+'</div>';
      html+='</div>';
      html+='<div class="lecture-actions">';
      if(l.pdfs&&l.pdfs.length){
        l.pdfs.forEach(function(pdf){
          html+='<a href="'+esc(pdf.url)+'" class="pdf-link" target="_blank" onclick="event.stopPropagation()">'+
            '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>'+
            esc(pdf.title)+
          '</a>';
        });
      }
      html+='<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="color:var(--_theme---accent)"><polyline points="9 18 15 12 9 6"/></svg>';
      html+='</div>';
      html+='</a>';
    });
    html+='</div>';
  }else{
    html+='<div class="empty-state">'+
      '<svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><polygon points="23 7 16 12 23 17 23 7"/><rect x="1" y="5" width="15" height="14" rx="2"/></svg>'+
      '<h3>No lectures yet</h3>'+
      '<p>Lectures will be added to this chapter soon. Check back later.</p>'+
    '</div>';
  }
  
  // Resources section
  var resources=courseData.resources||[];
  try{resources=typeof resources==='string'?JSON.parse(resources):resources}catch(e){resources=[]}
  
  if(resources.length){
    html+='<div class="section-divider">';
    html+='<h4>Course Resources</h4>';
    resources.forEach(function(r){
      html+='<a href="'+esc(r.url)+'" class="resource-link" target="_blank">'+
        '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>'+
        esc(r.title)+
      '</a>';
    });
    html+='</div>';
  }
  
  document.getElementById('mainContent').innerHTML=html;
}

async function loadCourse(){
  try{
    var res=await fetch('/api/courses/'+courseId);
    if(!res.ok)throw new Error('Course not found');
    
    courseData=await res.json();
    
    // Parse tree
    var tree;
    if(typeof courseData.tree==='string'){
      try{tree=JSON.parse(courseData.tree)}catch(e){tree=[]}
    }else{
      tree=courseData.tree||[];
    }
    
    console.log('Course loaded:',courseData.title);
    console.log('Tree data:',tree);
    
    // Update topbar
    document.getElementById('courseName').textContent=courseData.title;
    document.getElementById('courseMeta').textContent=(courseData.subject_area||'')+' | '+(courseData.difficulty||'All Levels');
    
    // Build sidebar
    document.getElementById('sidebar').innerHTML=buildSidebar(tree);
    
    // Build tree map for navigation
    buildTreeMap(tree);
    
    // Auto-open first subject and select first chapter
    var firstSubject=document.querySelector('.tree-subject');
    if(firstSubject){
      firstSubject.classList.add('open');
      var firstChapter=document.querySelector('.tree-chapter');
      if(firstChapter){
        var chId=firstChapter.getAttribute('data-chapter');
        if(chId&&treeMap[chId]){
          selectChapter(chId);
        }
      }else{
        // No chapters - show empty state
        document.getElementById('mainContent').innerHTML=
          '<div class="empty-state">'+
          '<svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="3" y1="9" x2="21" y2="9"/></svg>'+
          '<h3>Course structure is being built</h3>'+
          '<p>The curriculum for this course is being organized. Lectures will appear here once added by the instructor.</p>'+
          '</div>';
      }
    }else{
      // No subjects at all
      document.getElementById('mainContent').innerHTML=
        '<div class="empty-state">'+
        '<svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="3" y1="9" x2="21" y2="9"/></svg>'+
        '<h3>Content coming soon</h3>'+
        '<p>The course curriculum is currently being prepared. Please check back later.</p>'+
        '<a href="/dashboard.html" style="color:var(--_theme---accent);text-decoration:underline">Back to Dashboard</a>'+
        '</div>';
    }
    
  }catch(e){
    console.error('Error loading course:',e);
    document.getElementById('mainContent').innerHTML=
      '<div class="empty-state">'+
      '<svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#dc2626" stroke-width="1.5"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>'+
      '<h3>Failed to load course</h3>'+
      '<p>The course content could not be loaded. Please try again.</p>'+
      '<a href="/dashboard.html" style="color:var(--_theme---accent);text-decoration:underline">Back to Dashboard</a>'+
      '</div>';
  }
}

loadCourse();
</script>
</body>
</html>
