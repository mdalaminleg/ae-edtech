<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Learn — Excellence Gateway Academy</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Instrument+Sans:ital,wght@0,300;0,400;0,500;1,300;1,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{
      --swatch--ivory-medium:#F5F3EE;--swatch--ivory-light:#FAF9F5;
      --swatch--slate-dark:#141413;--swatch--slate-light:#3A3936;
      --swatch--cloud-medium:#8E8C86;--swatch--oat:#F0ECE2;
      --swatch--rust:#CC7853;--swatch--rust-hover:#B86A47;
      --_theme---background:var(--swatch--ivory-medium);--_theme---text:var(--swatch--slate-dark);
      --_theme---text-secondary:var(--swatch--cloud-medium);--_theme---border:rgba(20,20,19,0.12);
      --_theme---surface:var(--swatch--ivory-light);--_theme---accent:var(--swatch--rust);
      --_theme---accent-dim:rgba(204,120,83,0.08);
      --font-display:'Instrument Serif',Georgia,serif;--font-body:'Instrument Sans',system-ui,sans-serif;
      --font-mono:'JetBrains Mono',monospace;--radius-s:4px;--radius-m:8px;--radius-l:12px;
      --ease-main:cubic-bezier(.4,0,.2,1);--dur-fast:150ms;--dur-main:250ms;
      --nav--height:3.5rem;--sidebar-width:300px;
    }
    body{font-family:var(--font-body);background:var(--_theme---background);color:var(--_theme---text);height:100vh;overflow:hidden;display:flex;flex-direction:column;-webkit-font-smoothing:antialiased}
    a{color:inherit;text-decoration:none}button{cursor:pointer;font-family:inherit}
    .topbar{height:var(--nav--height);background:var(--_theme---surface);border-bottom:1px solid var(--_theme---border);display:flex;align-items:center;padding:0 1.5rem;gap:1rem;flex-shrink:0;z-index:50}
    .topbar-back{color:var(--_theme---text-secondary);font-size:0.85rem;transition:color var(--dur-fast)}.topbar-back:hover{color:var(--_theme---text)}
    .topbar-title{font-family:var(--font-display);font-size:1.1rem;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .topbar-meta{font-size:0.75rem;color:var(--_theme---text-secondary);white-space:nowrap}
    .layout{display:flex;flex:1;overflow:hidden}
    .sidebar{width:var(--sidebar-width);min-width:var(--sidebar-width);background:var(--_theme---surface);border-right:1px solid var(--_theme---border);overflow-y:auto;padding:1rem 0;transition:transform var(--dur-main) var(--ease-main)}
    .sidebar-btn{display:none;background:none;border:none;color:var(--_theme---text);padding:0.5rem;cursor:pointer}
    .main-content{flex:1;overflow-y:auto;padding:2rem}
    .tree-subject{padding:0.6rem 1rem;font-weight:500;color:var(--_theme---accent);cursor:pointer;display:flex;align-items:center;gap:0.4rem;font-size:0.9rem;border-left:3px solid transparent;transition:all var(--dur-fast)}
    .tree-subject:hover{background:var(--_theme---accent-dim)}
    .tree-subject.open{border-left-color:var(--_theme---accent)}
    .tree-subject svg{width:12px;height:12px;transition:transform var(--dur-fast)}.tree-subject.open svg{transform:rotate(90deg)}
    .tree-children{display:none}.tree-subject.open+.tree-children{display:block}
    .tree-paper{padding:0.45rem 1.5rem;font-weight:500;color:var(--_theme---text);cursor:pointer;display:flex;align-items:center;gap:0.4rem;font-size:0.85rem}
    .tree-paper svg{width:10px;height:10px;transition:transform var(--dur-fast)}.tree-paper.open svg{transform:rotate(90deg)}
    .tree-chapter{padding:0.35rem 2rem;font-size:0.82rem;color:var(--_theme---text-secondary);cursor:pointer;display:flex;align-items:center;gap:0.5rem;transition:all var(--dur-fast)}
    .tree-chapter:hover{color:var(--_theme---text)}.tree-chapter.active{color:var(--_theme---accent);font-weight:500}
    .status-dot{width:7px;height:7px;border-radius:50%;background:var(--_theme---text-secondary);flex-shrink:0}.status-dot.done{background:#16a34a}
    .breadcrumb{font-size:0.8rem;color:var(--_theme---text-secondary);margin-bottom:1.5rem}
    .lecture-list{display:flex;flex-direction:column;gap:0.5rem}
    .lecture-row{display:flex;align-items:center;gap:1rem;padding:1rem;background:var(--_theme---surface);border:1px solid var(--_theme---border);border-radius:var(--radius-m);transition:all var(--dur-fast);text-decoration:none;color:inherit}
    .lecture-row:hover{border-color:var(--_theme---accent);transform:translateX(3px)}
    .lecture-num{font-family:var(--font-display);font-size:1.2rem;color:var(--_theme---accent);min-width:30px}
    .lecture-info{flex:1}.lecture-title{font-weight:500;font-size:0.9rem}.lecture-meta{font-size:0.72rem;color:var(--_theme---text-secondary)}
    .pdf-badge{display:inline-flex;align-items:center;gap:0.3rem;background:var(--_theme---accent-dim);color:var(--_theme---accent);padding:0.2rem 0.6rem;border-radius:4px;font-size:0.7rem;text-decoration:none;margin-left:0.5rem}
    .pdf-badge:hover{background:var(--_theme---accent);color:#fff}
    .empty-state{text-align:center;padding:3rem;color:var(--_theme---text-secondary)}
    .resource-link{display:flex;align-items:center;gap:0.5rem;color:var(--_theme---accent);text-decoration:none;padding:0.4rem 0;font-size:0.85rem}.resource-link:hover{text-decoration:underline}
    .section-divider{border-top:1px solid var(--_theme---border);margin:2rem 0;padding-top:1.5rem}
    .sidebar-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.3);z-index:40}
    @media(max-width:768px){
      .sidebar{position:fixed;left:calc(-1*var(--sidebar-width));top:var(--nav--height);bottom:0;z-index:50}
      .sidebar.open{left:0}.sidebar-overlay.show{display:block}.sidebar-btn{display:block}
      .main-content{padding:1.5rem}
    }
  </style>
</head>
<body>

<div class="topbar">
  <button class="sidebar-btn" id="sidebarToggle" aria-label="Menu">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
  </button>
  <a href="/dashboard.html" class="topbar-back">&larr; Dashboard</a>
  <span class="topbar-title" id="courseName">Loading...</span>
  <span class="topbar-meta" id="courseMeta"></span>
</div>

<div class="layout">
  <div class="sidebar-overlay" id="sidebarOverlay"></div>
  <aside class="sidebar" id="sidebar"></aside>
  <main class="main-content" id="mainContent">
    <div class="empty-state">Loading course content...</div>
  </main>
</div>

<script>
function esc(s){var d=document.createElement('div');d.textContent=String(s||'');return d.innerHTML}
var token=localStorage.getItem('ega_token');
var user=JSON.parse(localStorage.getItem('ega_user')||'null');
if(!token||!user){window.location.href='/login.html'}

var params=new URLSearchParams(window.location.search);
var courseId=params.get('id');
var courseData=null;
var treeMap={};

document.getElementById('sidebarToggle').addEventListener('click',function(){
  document.getElementById('sidebar').classList.add('open');
  document.getElementById('sidebarOverlay').classList.add('show');
});
document.getElementById('sidebarOverlay').addEventListener('click',function(){
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('sidebarOverlay').classList.remove('show');
});

function buildSidebar(tree){
  return tree.map(function(s,si){
    return'<div class="tree-subject" onclick="toggleTree(this)" data-id="s'+si+'"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"/></svg>'+esc(s.name)+'</div><div class="tree-children">'+
    (s.papers||[]).map(function(p,pi){
      return'<div class="tree-paper" onclick="toggleTree(this)" data-id="p'+si+'-'+pi+'"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"/></svg>'+esc(p.name)+'</div><div class="tree-children">'+
      (p.chapters||[]).map(function(ch,ci){
        return'<div class="tree-chapter" data-id="ch'+si+'-'+pi+'-'+ci+'" onclick="selectChapter(\''+si+'-'+pi+'-'+ci+'\')"><span class="status-dot"></span>'+esc(ch.title)+'</div>';
      }).join('')+'</div>';
    }).join('')+'</div>';
  }).join('');
}

function toggleTree(el){el.classList.toggle('open')}

function buildTreeMap(tree){
  tree.forEach(function(s,si){
    (s.papers||[]).forEach(function(p,pi){
      (p.chapters||[]).forEach(function(ch,ci){
        treeMap['ch'+si+'-'+pi+'-'+ci]={subject:s,paper:p,chapter:ch,si:si,pi:pi,ci:ci};
      });
    });
  });
}

function selectChapter(key){
  var data=treeMap[key];if(!data)return;
  document.querySelectorAll('.tree-chapter').forEach(function(el){el.classList.remove('active')});
  document.querySelector('[data-id="'+key+'"]').classList.add('active');
  renderChapter(data);
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('sidebarOverlay').classList.remove('show');
}

function renderChapter(data){
  var s=data.subject,p=data.paper,ch=data.chapter;
  document.getElementById('mainContent').innerHTML=
    '<div class="breadcrumb">'+esc(s.name)+' / '+esc(p.name)+' / <span style="color:var(--_theme---text)">'+esc(ch.title)+'</span></div>'+
    '<h3 style="font-family:var(--font-display);font-size:1.3rem;margin-bottom:1.5rem">'+esc(ch.title)+'</h3>'+
    '<div class="lecture-list">'+
    ((ch.lectures||[]).length?ch.lectures.map(function(l,i){
      return'<a href="/watch.html?courseId='+courseId+'&lectureId='+(l.yt_video_id||l.id)+'&title='+encodeURIComponent(l.title)+'" class="lecture-row"><div class="lecture-num">'+String(i+1).padStart(2,'0')+'</div><div class="lecture-info"><div class="lecture-title">'+esc(l.title)+'</div><div class="lecture-meta">'+esc(ch.title)+'</div></div>'+
      ((l.pdfs||[]).length?l.pdfs.map(function(p){return'<a href="'+esc(p.url)+'" class="pdf-badge" target="_blank" onclick="event.stopPropagation()"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>PDF</a>'}).join(''):'')+'</a>';
    }).join(''):'<div class="empty-state">No lectures in this chapter yet.</div>')+
    '</div>';
}

async function loadCourse(){
  try{
    var res=await fetch('/api/courses/'+courseId);
    if(!res.ok)throw new Error();
    courseData=await res.json();
    var tree=typeof courseData.tree==='string'?JSON.parse(courseData.tree):(courseData.tree||[]);
    document.getElementById('courseName').textContent=courseData.title;
    document.getElementById('courseMeta').textContent=(courseData.subject_area||'')+' | '+(courseData.difficulty||'');
    document.getElementById('sidebar').innerHTML=buildSidebar(tree);
    buildTreeMap(tree);
    var firstSubj=document.querySelector('.tree-subject');
    if(firstSubj){firstSubj.classList.add('open');var firstCh=document.querySelector('.tree-chapter');if(firstCh)selectChapter(firstCh.dataset.id)}
  }catch(e){
    document.getElementById('mainContent').innerHTML='<div class="empty-state"><p style="color:#dc2626">Course not found.</p><a href="/dashboard.html" style="color:var(--_theme---accent)">Back to dashboard</a></div>';
  }
}

loadCourse();
</script>
</body>
</html>
