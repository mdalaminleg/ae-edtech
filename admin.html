<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Panel — Excellence Gateway Academy</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Instrument+Sans:ital,wght@0,300;0,400;0,500;1,300;1,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{
      --swatch--ivory-medium:#F5F3EE;--swatch--ivory-light:#FAF9F5;
      --swatch--slate-dark:#141413;--swatch--slate-light:#3A3936;
      --swatch--cloud-medium:#8E8C86;--swatch--oat:#F0ECE2;
      --swatch--rust:#CC7853;--swatch--rust-hover:#B86A47;
      --_theme---background:var(--swatch--ivory-medium);--_theme---text:var(--swatch--slate-dark);
      --_theme---text-secondary:var(--swatch--cloud-medium);--_theme---border:rgba(20,20,19,0.12);
      --_theme---border-strong:rgba(20,20,19,0.22);--_theme---surface:var(--swatch--ivory-light);
      --_theme---accent:var(--swatch--rust);--_theme---accent-dim:rgba(204,120,83,0.08);
      --font-display:'Instrument Serif',Georgia,serif;--font-body:'Instrument Sans',system-ui,sans-serif;
      --font-mono:'JetBrains Mono',monospace;--radius-s:4px;--radius-m:8px;--radius-l:12px;
      --ease-main:cubic-bezier(.4,0,.2,1);--dur-fast:150ms;--dur-main:250ms;
    }
    body{font-family:var(--font-body);background:var(--_theme---background);color:var(--_theme---text);display:flex;height:100vh;overflow:hidden;-webkit-font-smoothing:antialiased}
    a{color:inherit;text-decoration:none}button{cursor:pointer;font-family:inherit}
    .sidebar{width:220px;min-width:220px;background:var(--_theme---surface);border-right:1px solid var(--_theme---border);display:flex;flex-direction:column;padding:1.2rem 0}
    .sidebar .logo{padding:0 1.5rem 1.2rem;border-bottom:1px solid var(--_theme---border);margin-bottom:1rem;display:flex;align-items:center;gap:8px}
    .sidebar .logo img{height:24px}
    .sidebar .logo span{font-family:var(--font-display);font-size:0.95rem;color:var(--_theme---text)}
    .sidebar nav{flex:1;overflow-y:auto}
    .sidebar nav a{display:flex;align-items:center;gap:0.5rem;padding:0.55rem 1.5rem;color:var(--_theme---text-secondary);font-size:0.83rem;border-left:3px solid transparent;transition:all var(--dur-fast);cursor:pointer}
    .sidebar nav a:hover{color:var(--_theme---text);background:var(--swatch--oat)}
    .sidebar nav a.active{border-left-color:var(--_theme---accent);color:var(--_theme---accent);background:var(--_theme---accent-dim)}
    .sidebar .sfoot{padding:1rem 1.5rem;border-top:1px solid var(--_theme---border);font-size:0.73rem;color:var(--_theme---text-secondary)}
    .sidebar .sfoot a{color:#dc2626;cursor:pointer}
    .main{flex:1;overflow-y:auto;padding:2rem}
    .view{display:none}.view.active{display:block}
    .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:0.8rem;margin-bottom:2rem}
    .stat-card{background:var(--_theme---surface);border:1px solid var(--_theme---border);border-radius:var(--radius-m);padding:1rem}
    .stat-card .lbl{font-family:var(--font-mono);font-size:0.62rem;letter-spacing:0.08em;text-transform:uppercase;color:var(--_theme---text-secondary)}
    .stat-card .val{font-family:var(--font-display);font-size:1.8rem;color:var(--_theme---accent);margin-top:0.2rem}
    .section-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:1.5rem}
    .section-h h2{font-family:var(--font-display);font-size:1.4rem}
    table{width:100%;border-collapse:collapse;font-size:0.83rem}
    th{text-align:left;padding:0.6rem 0.7rem;color:var(--_theme---text-secondary);font-family:var(--font-mono);font-size:0.65rem;letter-spacing:0.08em;text-transform:uppercase;border-bottom:1px solid var(--_theme---border)}
    td{padding:0.55rem 0.7rem;border-bottom:1px solid var(--_theme---border)}
    tr:hover td{background:var(--_theme---accent-dim)}
    .badge{display:inline-block;padding:0.15rem 0.5rem;border-radius:20px;font-size:0.63rem;font-weight:500}
    .b-g{background:rgba(34,197,94,0.1);color:#16a34a}.b-o{background:rgba(245,158,11,0.1);color:#d97706}.b-r{background:rgba(220,38,38,0.08);color:#dc2626}.b-a{background:var(--_theme---accent-dim);color:var(--_theme---accent)}
    .btn{padding:0.28rem 0.65rem;font-size:0.68rem;font-weight:500;border-radius:var(--radius-s);border:1px solid var(--_theme---border-strong);cursor:pointer;font-family:var(--font-body);background:var(--_theme---surface);color:var(--_theme---text);transition:all var(--dur-fast);margin:1px;white-space:nowrap}
    .btn:hover{border-color:var(--_theme---accent);color:var(--_theme---accent)}
    .btn-d{color:#dc2626;border-color:rgba(220,38,38,0.2)}.btn-d:hover{background:rgba(220,38,38,0.05)}
    .btn-s{color:#16a34a;border-color:rgba(34,197,94,0.2)}.btn-s:hover{background:rgba(34,197,94,0.05)}
    .btn-a{color:var(--_theme---accent);border-color:rgba(204,120,83,0.3)}.btn-a:hover{background:var(--_theme---accent-dim)}
    .modal-overlay{position:fixed;inset:0;z-index:500;background:rgba(0,0,0,0.5);display:none;align-items:center;justify-content:center}
    .modal-overlay.show{display:flex}
    .modal{background:var(--_theme---surface);border:1px solid var(--_theme---border);border-radius:var(--radius-l);padding:1.8rem;width:90%;max-width:550px;max-height:85vh;overflow-y:auto}
    .modal h3{font-family:var(--font-display);font-size:1.2rem;margin-bottom:1.2rem}
    .fg{margin-bottom:0.8rem}
    .fg label{display:block;font-size:0.75rem;color:var(--_theme---text-secondary);margin-bottom:0.2rem}
    .fg input,.fg select,.fg textarea{width:100%;padding:0.5rem 0.7rem;background:var(--_theme---background);border:1px solid var(--_theme---border);border-radius:var(--radius-s);font-size:0.85rem;font-family:var(--font-body);color:var(--_theme---text);outline:none}
    .fg input:focus,.fg select:focus,.fg textarea:focus{border-color:var(--_theme---accent)}
    .fg textarea{resize:vertical;min-height:60px}
    .fr{display:grid;grid-template-columns:1fr 1fr;gap:0.6rem}
    .ma{display:flex;gap:0.6rem;justify-content:flex-end;margin-top:1.2rem}
    .tree-section{border:1px solid var(--_theme---border);border-radius:var(--radius-m);padding:0.8rem;margin-bottom:0.6rem}
    .tree-section-title{font-weight:500;font-size:0.85rem;color:var(--_theme---accent);display:flex;justify-content:space-between;align-items:center}
    .tree-paper{margin-left:1rem;padding:0.4rem 0;border-left:1px solid var(--_theme---border);padding-left:0.8rem;margin-bottom:0.4rem}
    .tree-paper-title{font-weight:500;font-size:0.82rem;display:flex;justify-content:space-between;align-items:center}
    .tree-chapter{margin-left:2rem;padding:0.25rem 0;font-size:0.8rem;color:var(--_theme---text-secondary);display:flex;justify-content:space-between;align-items:center}
    .tree-lecture{margin-left:3rem;padding:0.2rem 0;font-size:0.76rem;color:var(--_theme---text-secondary);display:flex;justify-content:space-between;align-items:center}
    .tree-actions{display:flex;gap:3px}
    .tree-actions button{background:none;border:none;color:var(--_theme---text-secondary);cursor:pointer;padding:1px 3px;font-size:0.65rem;border-radius:2px}
    .tree-actions button:hover{color:var(--_theme---accent)}.tree-actions button.del:hover{color:#dc2626}
    .resource-row{display:flex;align-items:center;gap:0.4rem;padding:0.3rem 0;font-size:0.8rem}
    .resource-row a{color:var(--_theme---accent);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .settings-card{background:var(--_theme---surface);border:1px solid var(--_theme---border);border-radius:var(--radius-m);padding:1.2rem;margin-bottom:1rem}
    .settings-card h4{font-size:0.9rem;margin-bottom:0.8rem}
    .cb{display:flex;align-items:center;gap:0.4rem;cursor:pointer;font-size:0.85rem}.cb input{accent-color:var(--_theme---accent)}
    .toast{position:fixed;bottom:2rem;right:2rem;z-index:600;padding:0.7rem 1.1rem;border-radius:var(--radius-s);font-size:0.85rem;opacity:0;transform:translateX(100px);transition:all 0.3s;pointer-events:none}
    .toast.show{opacity:1;transform:translateX(0)}
    .toast-ok{background:rgba(34,197,94,0.1);border:1px solid #16a34a;color:#16a34a}
    .toast-err{background:rgba(220,38,38,0.08);border:1px solid #dc2626;color:#dc2626}
    @media(max-width:768px){body{flex-direction:column}.sidebar{width:100%;min-width:100%;flex-direction:row;padding:0.4rem;overflow-x:auto;flex-shrink:0}.sidebar .logo,.sidebar .sfoot{display:none}.sidebar nav{display:flex}.sidebar nav a{padding:0.4rem 0.6rem;font-size:0.7rem;border-left:none;border-bottom:2px solid transparent;white-space:nowrap}.sidebar nav a.active{border-left:none;border-bottom-color:var(--_theme---accent)}.main{padding:1rem}.stats{grid-template-columns:1fr 1fr}}
  </style>
</head>
<body>

<aside class="sidebar">
  <div class="logo"><img src="/images/ega.png" height="24" alt="EGA"><span>EGA Admin</span></div>
  <nav>
    <a data-v="dashboard" class="active" onclick="showView('dashboard')">Dashboard</a>
    <a data-v="users" onclick="showView('users')">Users</a>
    <a data-v="courses" onclick="showView('courses')">Courses</a>
    <a data-v="payments" onclick="showView('payments')">Payments</a>
    <a data-v="settings" onclick="showView('settings')">Settings</a>
  </nav>
  <div class="sfoot"><span id="adminEmail"></span><br><a onclick="logout()">Sign Out</a></div>
</aside>

<main class="main">

  <div class="view active" id="view-dashboard">
    <div class="section-h"><h2>Dashboard</h2></div>
    <div class="stats">
      <div class="stat-card"><div class="lbl">Users</div><div class="val" id="sUsers">-</div></div>
      <div class="stat-card"><div class="lbl">Courses</div><div class="val" id="sCourses">-</div></div>
      <div class="stat-card"><div class="lbl">Pending Payments</div><div class="val" id="sPending">-</div></div>
      <div class="stat-card"><div class="lbl">Active Members</div><div class="val" id="sActive">-</div></div>
    </div>
  </div>

  <div class="view" id="view-users">
    <div class="section-h"><h2>Users</h2></div>
    <div style="overflow-x:auto"><table><thead><tr><th>Name</th><th>Email</th><th>Role</th><th>Status</th><th>Joined</th><th>Actions</th></tr></thead><tbody id="usersTbl"></tbody></table></div>
  </div>

  <div class="view" id="view-courses">
    <div class="section-h"><h2>Courses</h2><button class="btn btn-s" onclick="openCourseModal()">+ New Course</button></div>
    <div style="overflow-x:auto"><table><thead><tr><th>Title</th><th>Subject</th><th>Price</th><th>Actions</th></tr></thead><tbody id="coursesTbl"></tbody></table></div>
  </div>

  <div class="view" id="view-payments">
    <div class="section-h"><h2>Payment Verification</h2></div>
    <div style="overflow-x:auto"><table><thead><tr><th>User</th><th>Course</th><th>Method</th><th>TrxID</th><th>Phone</th><th>Status</th><th>Actions</th></tr></thead><tbody id="paymentsTbl"></tbody></table></div>
  </div>

  <div class="view" id="view-settings">
    <div class="section-h"><h2>Settings</h2></div>
    <div class="settings-card">
      <h4>Payment Numbers</h4>
      <div class="fg"><label>bKash Number</label><input type="text" id="setBkash" placeholder="01XXXXXXXXX"></div>
      <div class="fg"><label>Nagad Number</label><input type="text" id="setNagad" placeholder="01XXXXXXXXX"></div>
      <label class="cb"><input type="checkbox" id="setShow" checked> Show numbers on payment page</label>
      <div style="margin-top:1rem"><button class="btn btn-s" onclick="saveSettings()">Save</button></div>
    </div>
  </div>

</main>

<div class="modal-overlay" id="gModal"><div class="modal" id="gModalInner"></div></div>
<div class="toast" id="toast"></div>

<script>
var T=localStorage.getItem('ega_token');
var U=JSON.parse(localStorage.getItem('ega_user')||'null');
if(!T||!U||U.role!=='admin'){window.location.href='/login.html'}
document.getElementById('adminEmail').textContent=U.email;
function logout(){localStorage.clear();window.location.href='/'}
function esc(s){var d=document.createElement('div');d.textContent=String(s||'');return d.innerHTML}
function toast(msg,err){var t=document.getElementById('toast');t.textContent=msg;t.className='toast toast-'+(err?'err':'ok')+' show';setTimeout(function(){t.classList.remove('show')},2500)}

async function api(method,path,body){
  try{var opts={method:method,headers:{'Content-Type':'application/json',Authorization:'Bearer '+T}};if(body)opts.body=JSON.stringify(body);var res=await fetch('/api'+path,opts);var data=await res.json();return{ok:res.ok,data:data,status:res.status}}
  catch(e){return{ok:false,data:{error:'Network error'},status:0}}
}

function showView(id){
  document.querySelectorAll('.view').forEach(function(v){v.classList.remove('active')});
  var ve=document.getElementById('view-'+id);if(ve)ve.classList.add('active');
  document.querySelectorAll('.sidebar nav a').forEach(function(a){a.classList.remove('active')});
  var ne=document.querySelector('[data-v="'+id+'"]');if(ne)ne.classList.add('active');
  if(id==='dashboard')loadStats();if(id==='users')loadUsers();if(id==='courses')loadCourses();if(id==='payments')loadPayments();if(id==='settings')loadSettings();
}

function openModal(title,body,footer){
  document.getElementById('gModalInner').innerHTML='<h3>'+esc(title)+'</h3><div id="_alert"></div>'+body+(footer?'<div class="ma">'+footer+'</div>':'');
  document.getElementById('gModal').classList.add('show');
}
function closeModal(){document.getElementById('gModal').classList.remove('show')}
function modalAlert(msg,err){var a=document.getElementById('_alert');if(a){a.textContent=msg;a.style.cssText='padding:0.4rem 0.6rem;border-radius:var(--radius-s);font-size:0.75rem;margin-bottom:0.5rem;background:'+(err?'rgba(220,38,38,0.06)':'rgba(34,197,94,0.06)')+';border:1px solid '+(err?'#dc2626':'#16a34a')+';color:'+(err?'#dc2626':'#16a34a')}}
document.getElementById('gModal').addEventListener('click',function(e){if(e.target===document.getElementById('gModal'))closeModal()});

// ─── STATS ───
async function loadStats(){
  var r=await api('GET','/admin/stats');
  if(r.ok){document.getElementById('sUsers').textContent=r.data.users||0;document.getElementById('sCourses').textContent=r.data.courses||0;document.getElementById('sPending').textContent=r.data.pendingPayments||0;document.getElementById('sActive').textContent=r.data.activeMembers||0}
}

// ─── USERS ───
async function loadUsers(){
  var r=await api('GET','/admin/users');var t=document.getElementById('usersTbl');
  if(!r.ok){t.innerHTML='<tr><td colspan="6">Failed</td></tr>';return}
  if(!r.data.length){t.innerHTML='<tr><td colspan="6" style="text-align:center;padding:2rem;color:var(--_theme---text-secondary)">No users yet</td></tr>';return}
  t.innerHTML=r.data.map(function(u){var sb=u.is_blocked?'b-r':(u.is_approved?'b-g':'b-o'),st=u.is_blocked?'Blocked':(u.is_approved?'Approved':'Pending');
    return'<tr><td>'+esc(u.name)+'</td><td>'+esc(u.email)+'</td><td><span class="badge '+(u.role==='admin'?'b-a':'b-g')+'">'+esc(u.role)+'</span></td><td><span class="badge '+sb+'">'+st+'</span></td><td>'+new Date(u.created_at).toLocaleDateString()+'</td><td>'+
    (!u.is_approved?'<button class="btn btn-s" onclick="approveUser('+u.id+')">Approve</button> ':'')+
    '<button class="btn '+(u.is_blocked?'btn-s':'btn-d')+'" onclick="toggleBlock('+u.id+')">'+(u.is_blocked?'Unblock':'Block')+'</button> '+
    '<button class="btn" onclick="clearDevice('+u.id+')">Clear</button> '+
    '<button class="btn btn-d" onclick="deleteUser('+u.id+')">Delete</button></td></tr>';
  }).join('');
}
async function approveUser(id){await api('PUT','/admin/users/'+id+'/approve');loadUsers();toast('Approved')}
async function toggleBlock(id){await api('PUT','/admin/users/'+id+'/block');loadUsers();toast('Done')}
async function clearDevice(id){await api('PUT','/admin/users/'+id+'/clear-device');loadUsers();toast('Cleared')}
async function deleteUser(id){if(confirm('Delete user?')){await api('DELETE','/admin/users/'+id);loadUsers();toast('Deleted')}}

// ─── COURSES ───
var allCourses=[];
async function loadCourses(){
  var r=await api('GET','/admin/courses');var t=document.getElementById('coursesTbl');
  if(!r.ok){t.innerHTML='<tr><td colspan="4">Failed</td></tr>';return}
  allCourses=r.data;
  if(!allCourses.length){t.innerHTML='<tr><td colspan="4" style="text-align:center;padding:2rem;color:var(--_theme---text-secondary)">No courses yet. Create one.</td></tr>';return}
  t.innerHTML=allCourses.map(function(c){return'<tr><td>'+esc(c.title)+'</td><td>'+esc(c.subject_area||'-')+'</td><td>'+(c.price===0?'Free':'&#2547;'+c.price)+'</td><td>'+
    '<button class="btn btn-a" onclick="openTreeEditor('+c.id+')">Tree</button> '+
    '<button class="btn" onclick="editCourse('+c.id+')">Edit</button> '+
    '<button class="btn btn-d" onclick="deleteCourse('+c.id+')">Delete</button></td></tr>';
  }).join('');
}

function openCourseModal(course){
  var ed=!!course;
  openModal(ed?'Edit Course':'New Course',
    '<div class="fg"><label>Title *</label><input type="text" id="cTitle" value="'+esc(course?.title||'')+'"></div>'+
    '<div class="fg"><label>Description</label><textarea id="cDesc">'+esc(course?.description||'')+'</textarea></div>'+
    '<div class="fr"><div class="fg"><label>Subject</label><input type="text" id="cSubj" value="'+esc(course?.subject_area||'')+'"></div><div class="fg"><label>Difficulty</label><select id="cDiff"><option value="All Levels">All Levels</option><option value="Beginner" '+(course?.difficulty==='Beginner'?'selected':'')+'>Beginner</option><option value="Intermediate" '+(course?.difficulty==='Intermediate'?'selected':'')+'>Intermediate</option><option value="Advanced" '+(course?.difficulty==='Advanced'?'selected':'')+'>Advanced</option></select></div></div>'+
    '<div class="fr"><div class="fg"><label>Thumbnail URL</label><input type="text" id="cThumb" value="'+esc(course?.thumbnail_url||'')+'"></div><div class="fg"><label>Badge</label><input type="text" id="cBadge" value="'+esc(course?.badge||'')+'"></div></div>'+
    '<div class="fr"><div class="fg"><label>Price (0=free)</label><input type="number" id="cPrice" value="'+(course?.price||0)+'" step="1"></div><div class="fg"><label>Featured</label><select id="cFeat"><option value="0">No</option><option value="1" '+(course?.is_featured?'selected':'')+'>Yes</option></select></div></div>',
    '<button class="btn" onclick="closeModal()">Cancel</button><button class="btn btn-s" onclick="saveCourse('+(course?.id||0)+')">'+(ed?'Update':'Create')+'</button>');
}
async function saveCourse(id){
  var data={title:document.getElementById('cTitle').value.trim(),description:document.getElementById('cDesc').value.trim(),subject_area:document.getElementById('cSubj').value.trim(),difficulty:document.getElementById('cDiff').value,thumbnail_url:document.getElementById('cThumb').value.trim(),badge:document.getElementById('cBadge').value.trim(),price:parseFloat(document.getElementById('cPrice').value)||0,is_featured:parseInt(document.getElementById('cFeat').value)};
  if(!data.title){modalAlert('Title required',true);return}
  if(id){var ex=allCourses.find(function(c){return c.id===id});data.tree=ex?ex.tree:'[]';data.resources=ex?ex.resources:'[]'}
  var r=id?await api('PUT','/admin/courses/'+id,data):await api('POST','/admin/courses',data);
  if(r.ok){closeModal();loadCourses();toast(id?'Updated':'Created')}else{modalAlert(r.data.error||'Failed',true)}
}
async function editCourse(id){var r=await api('GET','/courses/'+id);if(r.ok)openCourseModal(r.data)}
async function deleteCourse(id){if(confirm('Delete course and all enrollments?')){await api('DELETE','/admin/courses/'+id);loadCourses();toast('Deleted')}}

// ─── TREE EDITOR ───
var _treeCourseId,_treeData,_treeResources;
function safeParse(s){try{return typeof s==='string'?JSON.parse(s):(s||[])}catch{return[]}}
async function openTreeEditor(cid){
  var r=await api('GET','/courses/'+cid);
  if(!r.ok){toast('Course not found',true);return}
  var c=r.data;_treeCourseId=cid;_treeData=safeParse(c.tree);_treeResources=safeParse(c.resources);
  renderTreeModal(c.title);
}
function renderTreeModal(title){
  var t=_treeData,r=_treeResources;
  var h='<div style="max-height:350px;overflow-y:auto">';
  h+='<button class="btn btn-a" onclick="addSubject()" style="margin-bottom:0.8rem">+ Add Subject</button>';
  if(!t.length)h+='<p style="color:var(--_theme---text-secondary);font-size:0.8rem">No content yet.</p>';
  t.forEach(function(s,si){
    h+='<div class="tree-section"><div class="tree-section-title"><span>'+esc(s.name)+'</span><div class="tree-actions"><button onclick="addPaper('+si+')">+ Paper</button><button onclick="renameSubject('+si+')">Rename</button><button class="del" onclick="deleteSubject('+si+')">Del</button></div></div>';
    (s.papers||[]).forEach(function(p,pi){
      h+='<div class="tree-paper"><div class="tree-paper-title"><span>'+esc(p.name)+'</span><div class="tree-actions"><button onclick="addChapter('+si+','+pi+')">+ Chapter</button><button onclick="renamePaper('+si+','+pi+')">Rename</button><button class="del" onclick="deletePaper('+si+','+pi+')">Del</button></div></div>';
      (p.chapters||[]).forEach(function(ch,ci){
        h+='<div class="tree-chapter"><span>'+esc(ch.title)+' ('+(ch.lectures||[]).length+' lec)</span><div class="tree-actions"><button onclick="addLecture('+si+','+pi+','+ci+')">+ Lecture</button><button onclick="renameChapter('+si+','+pi+','+ci+')">Rename</button><button class="del" onclick="deleteChapter('+si+','+pi+','+ci+')">Del</button></div></div>';
        (ch.lectures||[]).forEach(function(l,li){
          h+='<div class="tree-lecture"><span>'+esc(l.title)+'</span><div class="tree-actions"><button onclick="editLecture('+si+','+pi+','+ci+','+li+')">Edit</button><button class="del" onclick="deleteLecture('+si+','+pi+','+ci+','+li+')">Del</button></div></div>';
        });
      });
      h+='</div>';
    });
    h+='</div>';
  });
  h+='</div><h4 style="margin-top:1.2rem">Resources</h4><button class="btn btn-a" onclick="addResource()" style="margin-bottom:0.5rem">+ Add Resource</button>';
  if(!r.length)h+='<p style="color:var(--_theme---text-secondary);font-size:0.8rem">No resources.</p>';
  r.forEach(function(rs,i){h+='<div class="resource-row"><a href="'+esc(rs.url)+'" target="_blank">'+esc(rs.title)+'</a><button class="btn btn-d" style="font-size:0.6rem;padding:0.1rem 0.4rem" onclick="deleteResource('+i+')">Remove</button></div>'});
  openModal('Course Tree: '+esc(title),h,'<button class="btn" onclick="closeModal()">Close</button><button class="btn btn-s" onclick="saveTree()">Save All Changes</button>');
}
async function saveTree(){
  var r=await api('PUT','/admin/courses/'+_treeCourseId,{title:allCourses.find(function(c){return c.id===_treeCourseId})?.title||'',description:allCourses.find(function(c){return c.id===_treeCourseId})?.description||'',subject_area:allCourses.find(function(c){return c.id===_treeCourseId})?.subject_area||'',difficulty:allCourses.find(function(c){return c.id===_treeCourseId})?.difficulty||'All Levels',thumbnail_url:allCourses.find(function(c){return c.id===_treeCourseId})?.thumbnail_url||'',badge:allCourses.find(function(c){return c.id===_treeCourseId})?.badge||'',price:allCourses.find(function(c){return c.id===_treeCourseId})?.price||0,is_featured:allCourses.find(function(c){return c.id===_treeCourseId})?.is_featured||0,is_active:1,tree:JSON.stringify(_treeData),resources:JSON.stringify(_treeResources)});
  if(r.ok){closeModal();loadCourses();toast('Tree saved')}else{modalAlert('Failed to save',true)}
}
function pI(msg,def,cb){var v=prompt(msg,def||'');if(v!==null&&v.trim())cb(v.trim())}
function p2(m1,d1,m2,d2,cb){var v1=prompt(m1,d1||'');if(v1===null)return;var v2=prompt(m2,d2||'');if(v2===null)return;cb(v1.trim(),v2.trim())}
function addSubject(){pI('Subject name:','New Subject',function(n){_treeData.push({id:'s_'+Date.now(),name:n,papers:[]});renderTreeModal(allCourses.find(function(c){return c.id===_treeCourseId})?.title||'')})}
function renameSubject(si){pI('Rename:',_treeData[si].name,function(n){_treeData[si].name=n;renderTreeModal(allCourses.find(function(c){return c.id===_treeCourseId})?.title||'')})}
function deleteSubject(si){if(confirm('Delete subject?')){_treeData.splice(si,1);renderTreeModal(allCourses.find(function(c){return c.id===_treeCourseId})?.title||'')}}
function addPaper(si){pI('Paper name:','New Paper',function(n){_treeData[si].papers.push({id:'p_'+Date.now(),name:n,chapters:[]});renderTreeModal(allCourses.find(function(c){return c.id===_treeCourseId})?.title||'')})}
function renamePaper(si,pi){pI('Rename:',_treeData[si].papers[pi].name,function(n){_treeData[si].papers[pi].name=n;renderTreeModal(allCourses.find(function(c){return c.id===_treeCourseId})?.title||'')})}
function deletePaper(si,pi){if(confirm('Delete paper?')){_treeData[si].papers.splice(pi,1);renderTreeModal(allCourses.find(function(c){return c.id===_treeCourseId})?.title||'')}}
function addChapter(si,pi){pI('Chapter title:','New Chapter',function(n){_treeData[si].papers[pi].chapters.push({id:'ch_'+Date.now(),title:n,lectures:[]});renderTreeModal(allCourses.find(function(c){return c.id===_treeCourseId})?.title||'')})}
function renameChapter(si,pi,ci){pI('Rename:',_treeData[si].papers[pi].chapters[ci].title,function(n){_treeData[si].papers[pi].chapters[ci].title=n;renderTreeModal(allCourses.find(function(c){return c.id===_treeCourseId})?.title||'')})}
function deleteChapter(si,pi,ci){if(confirm('Delete chapter?')){_treeData[si].papers[pi].chapters.splice(ci,1);renderTreeModal(allCourses.find(function(c){return c.id===_treeCourseId})?.title||'')}}
function addLecture(si,pi,ci){p2('Lecture title:','New Lecture','YouTube Video ID:','dQw4w9WgXcQ',function(t,yt){_treeData[si].papers[pi].chapters[ci].lectures.push({id:'l_'+Date.now(),title:t,yt_video_id:yt,pdfs:[]});renderTreeModal(allCourses.find(function(c){return c.id===_treeCourseId})?.title||'')})}
function editLecture(si,pi,ci,li){
  var lec=_treeData[si].papers[pi].chapters[ci].lectures[li];
  var h='<div class="fg"><label>Title</label><input type="text" id="lecTitle" value="'+esc(lec.title)+'"></div><div class="fg"><label>YouTube Video ID</label><input type="text" id="lecYtId" value="'+esc(lec.yt_video_id||'')+'"></div><h4>PDFs</h4>';
  (lec.pdfs||[]).forEach(function(pdf,pi2){h+='<div class="resource-row"><span>'+esc(pdf.title)+'</span><button class="btn btn-d" style="font-size:0.6rem;padding:0.1rem 0.4rem" onclick="deletePdf('+si+','+pi+','+ci+','+li+','+pi2+')">Remove</button></div>'});
  h+='<button class="btn btn-a" style="margin-top:0.5rem" onclick="addPdf('+si+','+pi+','+ci+','+li+')">+ Add PDF</button>';
  openModal('Edit Lecture',h,'<button class="btn" onclick="closeModal()">Cancel</button><button class="btn btn-s" onclick="saveLecture('+si+','+pi+','+ci+','+li+')">Save</button>');
}
function saveLecture(si,pi,ci,li){_treeData[si].papers[pi].chapters[ci].lectures[li].title=document.getElementById('lecTitle').value.trim();_treeData[si].papers[pi].chapters[ci].lectures[li].yt_video_id=document.getElementById('lecYtId').value.trim();closeModal();renderTreeModal(allCourses.find(function(c){return c.id===_treeCourseId})?.title||'')}
function addPdf(si,pi,ci,li){p2('PDF title:','Notes','PDF URL:','https://',function(t,u){_treeData[si].papers[pi].chapters[ci].lectures[li].pdfs.push({title:t,url:u});editLecture(si,pi,ci,li)})}
function deletePdf(si,pi,ci,li,pi2){if(confirm('Remove PDF?')){_treeData[si].papers[pi].chapters[ci].lectures[li].pdfs.splice(pi2,1);editLecture(si,pi,ci,li)}}
function deleteLecture(si,pi,ci,li){if(confirm('Delete lecture?')){_treeData[si].papers[pi].chapters[ci].lectures.splice(li,1);renderTreeModal(allCourses.find(function(c){return c.id===_treeCourseId})?.title||'')}}
function addResource(){p2('Title:','Resource','URL:','https://',function(t,u){_treeResources.push({title:t,url:u});renderTreeModal(allCourses.find(function(c){return c.id===_treeCourseId})?.title||'')})}
function deleteResource(i){if(confirm('Remove?')){_treeResources.splice(i,1);renderTreeModal(allCourses.find(function(c){return c.id===_treeCourseId})?.title||'')}}

// ─── PAYMENTS ───
async function loadPayments(){
  var t=document.getElementById('paymentsTbl');t.innerHTML='<tr><td colspan="7" style="text-align:center;padding:2rem">Loading...</td></tr>';
  var r=await api('GET','/admin/enrollments');
  if(!r.ok){t.innerHTML='<tr><td colspan="7">Error</td></tr>';return}
  var list=r.data;
  if(!list||!list.length){t.innerHTML='<tr><td colspan="7" style="text-align:center;padding:2rem;color:var(--_theme---text-secondary)">No payments yet.</td></tr>';return}
  t.innerHTML=list.map(function(e){var sc='b-o';if(e.status==='approved')sc='b-g';if(e.status==='spam')sc='b-r';var a='';if(e.status==='pending'){a+='<button class="btn btn-s" onclick="verifyPay('+e.id+')">Verify</button> <button class="btn btn-d" onclick="spamPay('+e.id+')">Spam</button> ';}a+='<button class="btn btn-d" onclick="delPay('+e.id+')">Delete</button>';return'<tr><td>'+esc(e.user_name||'?')+'</td><td>'+esc(e.course_title||'?')+'</td><td>'+esc(e.payment_method||'-')+'</td><td style="font-family:var(--font-mono);font-size:0.75rem">'+esc(e.trx_id||'-')+'</td><td>'+esc(e.sender_phone||'-')+'</td><td><span class="badge '+sc+'">'+esc(e.status)+'</span></td><td>'+a+'</td></tr>'}).join('');
}
async function verifyPay(id){if(!confirm('Verify and grant access?'))return;var r=await api('PUT','/admin/enrollments/'+id+'/verify');if(r.ok){toast('Verified');loadPayments()}else toast(r.data?.error||'Failed',true)}
async function spamPay(id){if(!confirm('Mark as spam?'))return;var r=await api('PUT','/admin/enrollments/'+id+'/spam');if(r.ok){toast('Spam');loadPayments()}else toast(r.data?.error||'Failed',true)}
async function delPay(id){if(!confirm('Delete?'))return;var r=await api('DELETE','/admin/enrollments/'+id);if(r.ok){toast('Deleted');loadPayments()}else toast(r.data?.error||'Failed',true)}

// ─── SETTINGS ───
async function loadSettings(){var r=await api('GET','/admin/meta');if(r.ok){document.getElementById('setBkash').value=r.data.bkash_number||'';document.getElementById('setNagad').value=r.data.nagad_number||'';document.getElementById('setShow').checked=r.data.show_numbers!=='false'}}
async function saveSettings(){var r=await api('PUT','/admin/meta',{bkash_number:document.getElementById('setBkash').value.trim(),nagad_number:document.getElementById('setNagad').value.trim(),show_numbers:document.getElementById('setShow').checked?'true':'false'});if(r.ok)toast('Saved');else toast('Failed',true)}

loadStats();
