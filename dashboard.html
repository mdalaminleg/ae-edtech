<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard — Excellence Gateway Academy</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{
      --bg:#05080f;--surface:#0b0f1a;--surface2:#111827;--surface3:#161e2e;
      --border:rgba(255,255,255,0.07);--border2:rgba(255,255,255,0.11);
      --accent:#C9A84C;--accent2:#b8942f;--accent-dim:rgba(201,168,76,0.08);
      --white:#f0f4f8;--gray:#7a8899;--gray2:#a0adb8;
      --red:#f0566a;--green:#10d48e;--orange:#f59e0b;
      --radius:9px;--radius-lg:13px;
      --transition:.18s cubic-bezier(.4,0,.2,1)
    }
    body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--white);min-height:100vh}
    h1,h2,h3{font-family:'Cormorant Garamond',serif;font-weight:400}
    .header{
      position:sticky;top:0;z-index:100;
      background:rgba(5,8,15,0.92);backdrop-filter:blur(12px);
      border-bottom:1px solid var(--border);
      display:flex;align-items:center;justify-content:space-between;
      padding:0 5%;height:64px
    }
    .header-logo{display:flex;align-items:center;gap:10px;text-decoration:none}
    .header-logo img{height:32px}
    .header-logo span{font-family:'Cormorant Garamond',serif;font-size:1.3rem;font-weight:600;color:var(--white)}
    .header-logo span em{font-style:italic;color:var(--accent)}
    .header-right{display:flex;align-items:center;gap:1.5rem}
    .header-right a{font-size:0.85rem;color:var(--gray);text-decoration:none;transition:color var(--transition)}
    .header-right a:hover{color:var(--white)}
    .btn-logout{color:var(--red)!important}
    main{padding:3rem 5%;max-width:1100px;margin:0 auto}
    .welcome-bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:2rem;flex-wrap:wrap;gap:1rem}
    .welcome-bar h1{font-size:2rem}
    .welcome-bar h1 span{color:var(--accent)}
    .stats-row{display:grid;grid-template-columns:repeat(3,1fr);gap:1.5rem;margin-bottom:2.5rem}
    .stat-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:1.5rem}
    .stat-label{font-size:0.72rem;letter-spacing:0.1em;text-transform:uppercase;color:var(--gray);margin-bottom:0.5rem}
    .stat-value{font-family:'Cormorant Garamond',serif;font-size:2.5rem;color:var(--accent)}
    .section-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:1.5rem}
    .section-header h2{font-size:1.5rem}
    .courses-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1.5rem}
    .course-card{
      background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);
      overflow:hidden;transition:all var(--transition);text-decoration:none;color:inherit;display:block
    }
    .course-card:hover{transform:translateY(-4px);box-shadow:0 12px 40px rgba(0,0,0,0.3)}
    .course-thumb{height:140px;background:var(--surface2);display:flex;align-items:center;justify-content:center;position:relative}
    .course-thumb img{width:100%;height:100%;object-fit:cover}
    .course-thumb svg{width:40px;height:40px;color:var(--accent)}
    .course-body{padding:1.2rem}
    .course-subject{font-size:0.68rem;letter-spacing:0.1em;text-transform:uppercase;color:var(--accent);margin-bottom:0.3rem}
    .course-title{font-family:'Cormorant Garamond',serif;font-size:1.2rem;margin-bottom:0.5rem;line-height:1.3}
    .expiry-pill{display:inline-block;font-size:0.7rem;font-weight:500;padding:0.2rem 0.6rem;border-radius:20px;margin-bottom:0.8rem}
    .expiry-pill.green{background:rgba(16,212,142,0.1);color:var(--green)}
    .expiry-pill.orange{background:rgba(245,158,11,0.1);color:var(--orange)}
    .expiry-pill.red{background:rgba(240,86,106,0.1);color:var(--red)}
    .btn{display:inline-flex;align-items:center;gap:0.5rem;padding:0.5rem 1.2rem;font-size:0.78rem;font-weight:500;border-radius:var(--radius);border:none;cursor:pointer;text-decoration:none;font-family:'DM Sans',sans-serif;transition:all var(--transition)}
    .btn-primary{background:var(--accent);color:#05080f}
    .btn-primary:hover{background:var(--accent2)}
    .btn-outline{background:transparent;color:var(--white);border:1px solid var(--border2)}
    .btn-outline:hover{border-color:var(--accent)}
    .empty-state{text-align:center;padding:4rem 2rem;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);grid-column:1/-1}
    .empty-state svg{margin-bottom:1rem;color:var(--gray)}
    .empty-state h3{font-size:1.3rem;margin-bottom:0.5rem}
    .empty-state p{color:var(--gray);font-size:0.85rem;margin-bottom:1.5rem}
    .skeleton{background:linear-gradient(90deg,var(--surface2)25%,var(--surface3)50%,var(--surface2)75%);background-size:200% 100%;animation:shimmer 1.5s infinite;border-radius:var(--radius);height:250px}
    .toast{position:fixed;bottom:2rem;right:2rem;z-index:500;padding:1rem 1.5rem;border-radius:var(--radius);font-size:0.9rem;opacity:0;transform:translateX(100px);transition:all 0.3s ease;pointer-events:none}
    .toast.show{opacity:1;transform:translateX(0)}
    .toast-success{background:rgba(16,212,142,0.09);border:1px solid var(--green);color:var(--green)}
    @keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
    @media(max-width:768px){.stats-row,.courses-grid{grid-template-columns:1fr}}
  </style>
</head>
<body>

<header class="header">
  <a href="/" class="header-logo">
    <img src="/images/ega.png" height="32" alt="EGA">
    <span>Excellence <em>Gateway</em></span>
  </a>
  <div class="header-right">
    <a href="/explore.html">Browse Courses</a>
    <a href="#" onclick="logout()" class="btn-logout">Sign Out</a>
  </div>
</header>

<main>
  <div class="welcome-bar">
    <h1>Welcome, <span id="userName">Student</span></h1>
    <a href="/explore.html" class="btn btn-primary">Browse Courses</a>
  </div>

  <div class="stats-row">
    <div class="stat-card"><div class="stat-label">Enrolled Courses</div><div class="stat-value" id="statEnrolled">0</div></div>
    <div class="stat-card"><div class="stat-label">Active Memberships</div><div class="stat-value" id="statActive">0</div></div>
    <div class="stat-card"><div class="stat-label">Expiring Soon</div><div class="stat-value" id="statExpiring">0</div></div>
  </div>

  <div class="section-header"><h2>My Courses</h2></div>
  <div class="courses-grid" id="enrolledCourses">
    <div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div>
  </div>
</main>

<div class="toast" id="toast"></div>

<script>
function esc(s){const d=document.createElement('div');d.textContent=String(s||'');return d.innerHTML}
function showToast(msg,type='success'){const t=document.getElementById('toast');t.textContent=msg;t.className='toast toast-'+type+' show';setTimeout(()=>t.classList.remove('show'),3500)}

const token=localStorage.getItem('ega_token');
const user=JSON.parse(localStorage.getItem('ega_user')||'null');
if(!token||!user){window.location.href='/login.html'}
if(user.role==='admin'){window.location.href='/admin.html'}

document.getElementById('userName').textContent=user.name;

function logout(){localStorage.removeItem('ega_token');localStorage.removeItem('ega_user');window.location.href='/'}

async function loadDashboard(){
  try{
    const res=await fetch('/api/user/enrollments',{headers:{'Authorization':'Bearer '+token}});
    const enrollments=await res.json();
    const now=new Date();
    let activeCount=0,expiringCount=0;
    enrollments.forEach(e=>{
      if(e.expires_at){
        const exp=new Date(e.expires_at);
        if(exp>now)activeCount++;
        const daysLeft=Math.ceil((exp-now)/(1000*60*60*24));
        if(daysLeft>0&&daysLeft<=30)expiringCount++;
      }
    });
    document.getElementById('statEnrolled').textContent=enrollments.length;
    document.getElementById('statActive').textContent=activeCount;
    document.getElementById('statExpiring').textContent=expiringCount;

    const grid=document.getElementById('enrolledCourses');
    if(!enrollments.length){
      grid.innerHTML=`
        <div class="empty-state">
          <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
          <h3>No courses yet</h3><p>Browse our catalog and enroll in your first course.</p>
          <a href="/explore.html" class="btn btn-primary">Browse Courses</a>
        </div>`;
      return;
    }
    grid.innerHTML=enrollments.map(e=>{
      let pillClass='green',pillText='Active';
      if(e.expires_at){
        const exp=new Date(e.expires_at);
        if(exp<=now){pillClass='red';pillText='Expired'}
        else{const days=Math.ceil((exp-now)/(1000*60*60*24));if(days<=30){pillClass='orange';pillText=days+' days left'}}
      }
      return`
        <a href="/learn.html?id=${e.course_id}" class="course-card">
          <div class="course-thumb">
            ${e.thumbnail_url?`<img src="${esc(e.thumbnail_url)}" alt="">`:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="12" cy="12" r="3"/></svg>`}
          </div>
          <div class="course-body">
            <div class="course-subject">${esc(e.subject_area)}</div>
            <div class="course-title">${esc(e.course_title)}</div>
            <span class="expiry-pill ${pillClass}">${pillText}</span>
            <div><span class="btn btn-primary" style="font-size:0.72rem">Continue Learning</span></div>
          </div>
        </a>`;
    }).join('');
  }catch{
    document.getElementById('enrolledCourses').innerHTML='<div class="empty-state"><h3>Failed to load</h3><p><button onclick="loadDashboard()" style="color:var(--accent);background:none;border:none;cursor:pointer">Retry</button></p></div>';
  }
}

loadDashboard();
</script>
</body>
</html>
