<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account — Excellence Gateway Academy</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Instrument+Sans:ital,wght@0,300;0,400;0,500;1,300;1,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{
      --swatch--ivory-medium:#F5F3EE;--swatch--ivory-light:#FAF9F5;
      --swatch--slate-dark:#141413;--swatch--slate-light:#3A3936;
      --swatch--cloud-medium:#8E8C86;--swatch--rust:#CC7853;
      --_theme---background:var(--swatch--ivory-medium);
      --_theme---text:var(--swatch--slate-dark);--_theme---text-secondary:var(--swatch--cloud-medium);
      --_theme---border:rgba(20,20,19,0.12);--_theme---surface:var(--swatch--ivory-light);--_theme---accent:var(--swatch--rust);
      --font-display:'Instrument Serif',Georgia,serif;--font-body:'Instrument Sans',system-ui,sans-serif;
      --radius-s:4px;--radius-l:12px;--ease-main:cubic-bezier(.4,0,.2,1);--dur-fast:150ms;
      --site--margin:clamp(1.5rem,4vw,5rem);--nav--height:4.25rem;
    }
    body{font-family:var(--font-body);background:var(--_theme---background);color:var(--_theme---text);min-height:100vh;display:flex;flex-direction:column;-webkit-font-smoothing:antialiased}
    a{color:inherit;text-decoration:none}
    button{cursor:pointer;font-family:inherit}
    .nav_wrap{height:var(--nav--height);background:rgba(245,243,238,0.94);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);border-bottom:1px solid var(--_theme---border);display:flex;align-items:center}
    .nav_contain{width:100%;max-width:1440px;margin:0 auto;padding:0 var(--site--margin);display:flex;align-items:center;justify-content:space-between}
    .nav_logo_wrap{display:flex;align-items:center;gap:0.65rem;text-decoration:none}
    .nav_logo_wrap img{height:28px}
    .nav_logo_name{font-family:var(--font-display);font-size:1.1rem;font-weight:400;color:var(--_theme---text)}
    .nav_actions{display:flex;align-items:center;gap:0.5rem}
    .btn_main_wrap{display:inline-flex;align-items:center;border-radius:var(--radius-s);transition:all var(--dur-fast) var(--ease-main);cursor:pointer;text-decoration:none}
    .btn_main_wrap.is-nav{background:var(--swatch--slate-dark);color:var(--swatch--ivory-light);border:1px solid var(--swatch--slate-dark)}
    .btn_main_wrap.is-nav:hover{background:var(--swatch--slate-light)}
    .btn_main_text{font-family:var(--font-body);font-size:0.875rem;font-weight:500;letter-spacing:0.01em;padding:0.6rem 1.25rem;line-height:1;white-space:nowrap}
    .main{flex:1;display:flex;align-items:center;justify-content:center;padding:2rem}
    .auth-wrap{width:100%;max-width:480px}
    .auth-card{background:var(--_theme---surface);border:1px solid var(--_theme---border);border-radius:var(--radius-l);padding:2.5rem}
    .auth-card h1{font-family:var(--font-display);font-size:1.6rem;font-weight:400;margin-bottom:0.3rem}
    .auth-card .sub{font-size:0.875rem;color:var(--_theme---text-secondary);margin-bottom:2rem}
    .form-group{margin-bottom:1rem}
    .form-group label{display:block;font-size:0.8rem;color:var(--_theme---text-secondary);margin-bottom:0.3rem;font-weight:500}
    .form-group input{width:100%;padding:0.7rem 0.9rem;background:var(--_theme---background);border:1px solid var(--_theme---border);border-radius:var(--radius-s);font-size:0.9rem;font-family:var(--font-body);color:var(--_theme---text);outline:none;transition:border var(--dur-fast) var(--ease-main)}
    .form-group input:focus{border-color:var(--_theme---accent)}
    .form-row{display:grid;grid-template-columns:1fr 1fr;gap:0.8rem}
    .btn{width:100%;padding:0.8rem;font-size:0.9rem;font-weight:500;border-radius:var(--radius-s);border:none;cursor:pointer;font-family:var(--font-body);transition:all var(--dur-fast) var(--ease-main);display:flex;align-items:center;justify-content:center;gap:0.5rem}
    .btn-primary{background:var(--swatch--slate-dark);color:#fff}.btn-primary:hover{background:var(--swatch--slate-light)}
    .btn-primary:disabled{opacity:0.5;cursor:not-allowed}
    .spinner{width:18px;height:18px;border:2px solid transparent;border-top-color:#fff;border-radius:50%;animation:spin 0.6s linear infinite;display:none}
    .btn-loading .spinner{display:block}.btn-loading .btn-text{display:none}
    .alert{padding:0.7rem 0.9rem;border-radius:var(--radius-s);font-size:0.82rem;margin-bottom:1rem;display:none}
    .alert-error{background:rgba(220,38,38,0.08);border:1px solid #dc2626;color:#dc2626;display:block}
    .link{color:var(--_theme---accent);text-decoration:none;font-weight:500}.link:hover{text-decoration:underline}
    .auth-footer{text-align:center;margin-top:1.5rem;font-size:0.85rem;color:var(--_theme---text-secondary)}
    .success-state{text-align:center;padding:2rem 0;display:none}
    .success-state svg{margin-bottom:1rem;color:#16a34a}
    @keyframes spin{to{transform:rotate(360deg)}}
    footer{background:var(--swatch--slate-dark);color:rgba(250,249,245,0.4);padding:1.5rem 0;text-align:center;font-size:0.78rem;margin-top:auto}
  </style>
</head>
<body>
<nav class="nav_wrap"><div class="nav_contain">
  <a href="/" class="nav_logo_wrap"><img src="/images/ega.png" height="28" alt="EGA"><span class="nav_logo_name">Excellence Gateway</span></a>
  <div class="nav_actions"><a href="/login.html" class="btn_main_wrap is-nav"><span class="btn_main_text">Sign In</span></a></div>
</div></nav>
<main class="main">
  <div class="auth-wrap">
    <div class="auth-card">
      <div id="formArea">
        <h1>Create your account</h1>
        <p class="sub">Start your learning journey with Excellence Gateway.</p>
        <div id="alert"></div>
        <form onsubmit="handleSignup(event)">
          <div class="form-group"><label>Full Name</label><input type="text" id="name" placeholder="Your full name" required></div>
          <div class="form-group"><label>Email</label><input type="email" id="email" placeholder="you@example.com" required></div>
          <div class="form-row">
            <div class="form-group"><label>Phone (optional)</label><input type="tel" id="phone" placeholder="01XXXXXXXXX"></div>
            <div class="form-group"><label>Institution (optional)</label><input type="text" id="institution" placeholder="Your institution"></div>
          </div>
          <div class="form-group"><label>Password</label><input type="password" id="password" placeholder="Min 6 characters" required minlength="6"></div>
          <div class="form-group"><label>Confirm Password</label><input type="password" id="confirmPassword" placeholder="Re-enter password" required minlength="6"></div>
          <button type="submit" class="btn btn-primary" id="signupBtn"><span class="btn-text">Create Account</span><span class="spinner"></span></button>
        </form>
      </div>
      <div class="success-state" id="successState">
        <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#16a34a" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="16 10 12 14 8 10"/></svg>
        <h2 style="font-family:var(--font-display);font-size:1.4rem;font-weight:400">Account created</h2>
        <p style="color:var(--_theme---text-secondary);margin-top:0.5rem"><a href="/login.html" class="link">Sign in</a> to get started.</p>
      </div>
    </div>
    <p class="auth-footer">Already have an account? <a href="/login.html" class="link">Sign in</a></p>
  </div>
</main>
<footer>&copy; 2026 Excellence Gateway Academy. All rights reserved.</footer>
<script>
function showAlert(msg){var a=document.getElementById('alert');a.textContent=msg;a.className='alert alert-error';setTimeout(function(){a.className='alert'},5000)}
function setLoading(l){var b=document.getElementById('signupBtn');if(l){b.classList.add('btn-loading');b.disabled=true}else{b.classList.remove('btn-loading');b.disabled=false}}
async function handleSignup(e){
  e.preventDefault();document.getElementById('alert').className='alert';
  var name=document.getElementById('name').value.trim();
  var email=document.getElementById('email').value.trim();
  var phone=document.getElementById('phone').value.trim();
  var institution=document.getElementById('institution').value.trim();
  var password=document.getElementById('password').value;
  var cp=document.getElementById('confirmPassword').value;
  if(!name||!email||!password)return showAlert('Name, email, and password required');
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email))return showAlert('Invalid email');
  if(password.length<6)return showAlert('Password must be at least 6 characters');
  if(password!==cp)return showAlert('Passwords do not match');
  setLoading(true);
  try{
    var res=await fetch('/api/auth/signup',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:name,email:email,password:password,phone:phone,institution:institution})});
    var data=await res.json();
    if(!res.ok){showAlert(data.error||'Signup failed');setLoading(false);return}
    document.getElementById('formArea').style.display='none';
    document.getElementById('successState').style.display='block';
  }catch(e){showAlert('Network error');setLoading(false)}
}
</script>
</body>
</html>
